<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>🔑 임차인 매물·마이홈 — Rent3 Tenant</title>
  <link rel="stylesheet" href="/shared/ui/base.css">
  <style>
    .app-shell { max-width: 860px; margin: 0 auto; padding: 16px 14px 70px; }
    .nav-pills { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 12px; }
    .mode-switch { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin: 12px 0; }
    .mode-btn.is-active { background: linear-gradient(120deg, var(--primary), var(--primary-2)); border-color: transparent; font-weight: 800; }
    .listing-card { padding: 16px; border-radius: 16px; background: var(--surface); border: 1px solid var(--border); margin-bottom: 12px; }
    .field-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 10px; }
    .cert-paper { background: #fff; color: #111; padding: 24px; border-radius: 14px; margin-top: 14px; }
    .cert-paper table { width: 100%; border-collapse: collapse; margin: 10px 0; font-size: 13px; }
    .cert-paper th, .cert-paper td { border: 1px solid #444; padding: 7px 9px; text-align: left; }
    .cert-paper th { background: #f1f5f9; }
    @media print {
      body { background: #fff !important; color: #000 !important; }
      .no-print { display: none !important; }
      .app-shell { max-width: none; padding: 0; }
      .cert-paper { padding: 0; margin: 0; }
    }
  </style>
</head>
<body>
  <main class="app-shell">
    <div id="app-alert"></div>

    <div class="nav-pills no-print">
      <a class="bass-btn bass-btn--sm" href="/rent3/pool.html">🌐 통합 Data Pool 허브</a>
      <a class="bass-btn bass-btn--sm" href="/rent3_admin/">👑 관리인 앱</a>
      <a class="bass-btn bass-btn--sm" href="/rent3_lessor/">🏢 임대인 앱</a>
      <a class="bass-btn bass-btn--sm bass-btn--primary" href="/rent3_contract/?role=tenant">🤝 공동 임대계약 앱</a>
      <a class="bass-btn bass-btn--sm" href="manual.html">📘 매뉴얼</a>
    </div>

    <header class="bass-card no-print">
      <div class="bass-row" style="justify-content:space-between;">
        <div>
          <h1 style="font-size:21px;margin-bottom:4px;">🔑 임차인 직거래 매물 · 세입자 마이홈</h1>
          <div class="bass-muted" style="font-size:13px;">중개수수료 0원 공실 탐색부터 월세 납부 · 도어락 · 연말정산 17% 세액공제 증명서까지</div>
        </div>
        <span id="poolBadge" class="bass-badge bass-badge--ok bass-badge--pulse">JSON Pool 연동</span>
      </div>

      <div class="mode-switch">
        <button id="btnModeMyhome" class="bass-btn mode-btn is-active" type="button">🏠 입주 세입자 마이홈 라운지</button>
        <button id="btnModeListings" class="bass-btn mode-btn" type="button">📢 복비 0원 즉시입주 공실 탐색</button>
      </div>
    </header>

    <section id="viewMyhome" style="margin-top:14px;"></section>
    <section id="viewListings" class="no-print" style="display:none;margin-top:14px;"></section>
  </main>

  <script src="/shared/ui/bass.js"></script>
  <script src="/rent3/session-bar.js"></script>
  <script src="app.js"></script>
</body>
</html>
