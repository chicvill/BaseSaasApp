<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>🏢 임대인 자산·수납 관제 — Rent3 Lessor</title>
  <link rel="stylesheet" href="/shared/ui/base.css">
  <style>
    .app-shell { max-width: 960px; margin: 0 auto; padding: 16px 14px 70px; }
    .nav-pills { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 12px; }
    .kpi-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 10px; margin: 12px 0; }
    .kpi-box { padding: 14px; border-radius: 14px; background: var(--surface); border: 1px solid var(--border); }
    .kpi-val { font-size: 21px; font-weight: 800; margin-top: 4px; }
    .tabs { display: flex; gap: 6px; flex-wrap: wrap; margin: 14px 0; }
    .tab-btn.is-active { background: linear-gradient(120deg, var(--primary), var(--primary-2)); border-color: transparent; font-weight: 800; }
    .room-card { padding: 16px; border-radius: 16px; background: var(--surface); border: 1px solid var(--border); margin-bottom: 12px; }
    .field-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 10px; }
    .month-chip { display: inline-block; font-size: 11.5px; padding: 4px 8px; border-radius: 8px; margin: 2px; border: 1px solid var(--border); }
    .month-PAID { color: var(--ok); border-color: hsl(152 65% 50% / .4); }
    .month-UNPAID, .month-PARTIAL { color: var(--err); border-color: hsl(356 85% 62% / .5); font-weight: 700; }
    .month-EXEMPT_POSTPAID { color: var(--primary-2); border-color: hsl(196 95% 58% / .4); }
  </style>
</head>
<body>
  <main class="app-shell">
    <div id="app-alert"></div>

    <div class="nav-pills">
      <a class="bass-btn bass-btn--sm" href="/rent3/pool.html">🌐 통합 Data Pool 허브</a>
      <a class="bass-btn bass-btn--sm" href="/rent3_admin/">👑 관리인 앱</a>
      <a class="bass-btn bass-btn--sm bass-btn--primary" href="/rent3_contract/">🤝 공동 임대계약 앱</a>
      <a class="bass-btn bass-btn--sm" href="/rent3_tenant/">🔑 임차인 앱</a>
      <a class="bass-btn bass-btn--sm" href="manual.html">📘 매뉴얼</a>
    </div>

    <header class="bass-card">
      <div class="bass-row" style="justify-content:space-between;">
        <div>
          <h1 style="font-size:21px;margin-bottom:4px;">🏢 임대인 자산 · FIFO 수납 관제 센터</h1>
          <div id="bldgSubtitle" class="bass-muted" style="font-size:13px;">공동 JSON Data Pool 실시간 연동 중...</div>
        </div>
        <div class="bass-row">
          <select id="branchSelect" class="bass-select" style="width:auto;"></select>
          <span id="poolRevBadge" class="bass-badge bass-badge--ok bass-badge--pulse">Pool v-</span>
        </div>
      </div>

      <div id="kpiGrid" class="kpi-grid"></div>
    </header>

    <nav class="tabs" id="tabBar">
      <button class="bass-btn tab-btn is-active" data-tab="ledger" type="button">💰 호실장부 & 문자 FIFO 수납</button>
      <button class="bass-btn tab-btn" data-tab="tax" type="button">📊 공용운영비 · NOI · 종소세</button>
      <button class="bass-btn tab-btn" data-tab="ops" type="button">🔧 A/S · 1:1채팅 · 퇴실정산</button>
      <button class="bass-btn tab-btn" data-tab="rooms" type="button">🚪 신규호실 등록 · 도어락/주차</button>
    </nav>

    <section id="tabContent"></section>
  </main>

  <script src="/shared/ui/bass.js"></script>
  <script src="app.js"></script>
</body>
</html>
