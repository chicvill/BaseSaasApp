<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Rent4 계약 확인</title>
  <meta name="description" content="로그인한 계약 상대방이 계약 내용을 확인·동의하고 체결 뒤 시작합니다.">
  <link rel="stylesheet" href="/shared/ui/base.css">
  <link rel="stylesheet" href="rent4.css">
  <style>
    dl.terms { display: grid; grid-template-columns: 110px 1fr; gap: 8px 12px; margin: 0; font-size: 14px; }
    dl.terms dt { color: var(--muted); }
    dl.terms dd { margin: 0; font-variant-numeric: tabular-nums; }
    .steps { display: flex; gap: 6px; flex-wrap: wrap; font-size: 12.5px; }
    .steps span { padding: 6px 10px; border-radius: 999px; border: 1px solid var(--border); color: var(--muted); }
    .steps span.on { color: var(--text); border-color: var(--primary); background: hsl(258 90% 66% / .18); }
    .cred { font: 700 20px ui-monospace, Consolas, monospace; letter-spacing: .04em; }
  </style>
</head>
<body>
<main class="bass-container" style="max-width:560px">
  <header class="top">
    <div>
      <h1>📝 계약 확인</h1>
      <p class="sub bass-muted" id="kind">불러오는 중...</p>
    </div>
    <button class="bass-btn bass-btn--sm bass-btn--ghost hide" id="btnLogout">로그아웃</button>
  </header>
  <div id="app-alert"></div>

  <section id="body" class="stack hide">
    <div class="steps" id="steps"></div>
    <div class="bass-card stack"><dl class="terms" id="terms"></dl></div>

    <!-- 계약 전 본인 확인 (카카오 · 구글) -->
    <div id="verifyCard" class="bass-card stack hide">
      <h2 style="margin:0;font-size:17px">본인 확인</h2>
      <p class="bass-muted" style="margin:0;font-size:13.5px">계약에 동의하기 전에 쓰고 계신 카카오 또는 구글 계정으로 본인 확인을 해 주세요.
        확인한 계정으로 다음부터 바로 로그인할 수도 있습니다.</p>
      <div class="bass-row" id="verifyButtons"></div>
    </div>
    <div id="verifiedNote" class="bass-muted hide" style="font-size:13.5px"></div>

    <!-- ② 로그인한 상태: 계약 동의 -->
    <form id="signForm" class="bass-card stack hide">
      <h2 style="margin:0;font-size:17px">계약 내용 동의</h2>
      <label class="bass-row" style="gap:8px;font-size:14px"><input type="checkbox" id="agree" aria-label="계약 내용 동의"> 위 계약 내용을 확인했으며 동의합니다.</label>
      <button class="bass-btn bass-btn--primary" id="btnSign" type="submit">동의하고 계약 확인</button>
    </form>

    <div id="stateCard" class="bass-card stack hide"></div>
  </section>
</main>
<script src="/shared/ui/bass.js"></script>
<script src="rent4.js"></script>
<script>
(function () {
  "use strict";
  const $ = (id) => document.getElementById(id);
  const esc = Bass.escapeHtml;
  const won = (n) => `${Number(n || 0).toLocaleString("ko-KR")}원`;
  const period = (c) => (c.start || c.end) ? `${c.start || "미정"} ~ ${c.end || "미정"}` : "미정";
  const STEPS = ["① 비밀번호 설정", "② 계약 동의", "③ 납부 확인 · 체결"];
  const LOGIN_HINT = "언제든 로그인 페이지에서 휴대폰 번호와 비밀번호로 들어와 진행 상황을 볼 수 있습니다.";

  /** 로그인한 경우: 내 계약 진행 상황. */
  async function loadProviders() {
    const { providers } = await Bass.api("rent4", "/oauth/providers");
    $("verifyButtons").innerHTML = providers.map((p) =>
      `<button class="bass-btn ${p.id === "kakao" ? "bass-btn--primary" : ""}" type="button" data-provider="${esc(p.id)}">${esc(p.label)}로 본인 확인</button>`).join("");
  }

  $("verifyButtons").addEventListener("click", (e) => {
    const btn = e.target.closest("[data-provider]");
    if (!btn) return;
    Bass.withLock(btn, async () => {
      const r = await Bass.api("rent4", `/oauth/${btn.dataset.provider}/start`, { method: "POST", body: { purpose: "link" } });
      location.href = r.url;
    }, "이동 중...");
  });

  const oauthResult = (location.hash.match(/oauth=(\w+)/) || [])[1];
  if (oauthResult) {
    history.replaceState(null, "", location.pathname);
    if (oauthResult === "linked") Bass.updateAppAlert("success", "본인 확인이 끝났습니다.", "이제 계약 내용에 동의할 수 있습니다.");
    if (oauthResult === "used") Bass.updateAppAlert("error", "이미 다른 사람이 연결한 계정입니다.", "본인 계정으로 다시 확인해 주세요.");
  }

  async function loadMine() {
    await loadProviders();
    const { contract: c } = await Bass.api("rent4", "/contract/mine");
    $("btnLogout").classList.remove("hide");
    render(c);
  }

  function render(c) {
    current = c;
    $("body").classList.remove("hide");
    $("kind").textContent = `${c.kind_label} · ${c.building_name}${c.room ? ` ${c.room}호` : ""} · ${c.status_label}`;
    let reached = c.status === "cancelled" ? 0 : c.status === "active" ? 3 : c.status === "signed" ? 2 : 1;
    let steps = STEPS;
    if (c.member) {
      steps = ["① 요청 · 현장 점검", "② 조건 · 정보 입력", "③ 등기 확인 · 확정", "④ 최종 승인 · 계약금", "⑤ 계약 완료", "⑥ 입주"];
      reached = { requested: 1, offered: 2, tenant_approved: 2, registry_checked: 3, tenant_confirmed: 4,
                  contracted: 5, active: 6 }[c.status] || 0;      // 단계 표시: 지금 머무는 단계까지 켠다
    }
    $("steps").innerHTML = steps.map((label, i) => `<span class="${i < reached ? "on" : ""}">${label}</span>`).join("");
    const rows = c.kind === "membership"
      ? [["계약", "Rent4 가맹 계약 (건물 임대인)"], ["건물", c.building_name], ["건물 코드 / 아이디", c.building_code],
         ["임대인", c.party_name], ["가맹비", won(c.fee)], ["계약 기간", period(c)]]
      : [["계약", "주택 임대차 계약"], ["건물 · 호실", `${c.building_name} ${c.room}호`], ...(c.address ? [["주소", c.address]] : []),
         ["임차인", c.party_name], ["구분", `${c.lease_type} · ${c.pay_timing}`], ["보증금", won(c.deposit)],
         ...(c.down_payment ? [["계약금 / 잔금", `${won(c.down_payment)} / ${won(c.deposit - c.down_payment)}`]] : []),
         ["월 임차료", won(c.rent)], ["월 관리비", won(c.mgmt)], ["계약 기간", period(c)]];
    $("terms").innerHTML = rows.map(([k, v]) => `<dt>${esc(k)}</dt><dd>${esc(v)}</dd>`).join("");

    const needVerify = c.status === "sent" && c.verify_required && !c.verified;
    $("verifyCard").classList.toggle("hide", !needVerify);
    $("signForm").classList.toggle("hide", c.status !== "sent" || needVerify);
    $("verifiedNote").classList.toggle("hide", !c.verified);
    if (c.verified) $("verifiedNote").textContent = `✅ ${c.verified.provider === "kakao" ? "카카오" : "구글"} 계정으로 본인 확인 완료 (${c.verified.name || ""})`;

    const box = $("stateCard");
    const pay = c.kind === "membership" ? "가맹비" : "잔금";
    let html = "";
    const docBtn = c.finalized_at ? `<a class="bass-btn" href="contract_doc.html?id=${encodeURIComponent(c.id)}">📄 확정 계약서 보기 · 인쇄</a>` : "";
    if (c.status === "requested") {
      html = `<strong>📨 계약을 요청했습니다 — 현장 점검이 필요합니다</strong>
        <div class="bass-muted">임대인 채팅창에 안내가 갔습니다. 오른쪽 아래 💬 채팅이나 전화로 방을 볼 날짜를 정해 주세요. 점검 뒤 임대인이 계약 조건을 보내면 이 화면에서 이어 갑니다.</div>`;
    } else if (c.status === "offered") {
      const today = c.start || "";
      html = `<strong>📝 임대인이 계약 조건을 보냈습니다</strong>
        <div class="bass-muted">위 조건을 확인하고, 만족하면 아래 정보를 입력해 승인해 주세요. <b>주민등록번호는 입력하지 않습니다.</b></div>
        <form id="approveForm" class="stack" style="gap:10px">
          <div><label class="bass-label" for="fBirth">생년월일</label><input class="bass-input" id="fBirth" type="date" required></div>
          <div><label class="bass-label" for="fAddr">현 주소</label><input class="bass-input" id="fAddr" autocomplete="street-address" required></div>
          <div><label class="bass-label" for="fEmerg">비상 연락처 (선택, 이름 · 관계 · 번호)</label><input class="bass-input" id="fEmerg" placeholder="예: 홍부모 · 부 · 010-0000-0000"></div>
          <div class="bass-row" style="gap:10px;flex-wrap:wrap">
            <div style="flex:1 1 160px"><label class="bass-label" for="fStart">전입일 (입주일)</label><input class="bass-input" id="fStart" type="date" value="${esc(today)}" required></div>
            <div style="flex:1 1 120px"><label class="bass-label" for="fPeriod">계약 기간 (개월)</label><input class="bass-input" id="fPeriod" type="number" min="1" max="60" value="${esc(c.period_months || 12)}" required></div>
          </div>
          <label style="display:flex;gap:8px;align-items:flex-start;font-size:14px"><input type="checkbox" id="fAgree" style="margin-top:4px"> 위 계약 조건을 확인했으며 동의합니다.</label>
          <button class="bass-btn bass-btn--primary" type="submit">입력하고 승인</button>
        </form>`;
    } else if (c.status === "tenant_approved") {
      html = `<strong>✅ 정보를 입력하고 승인했습니다</strong>
        <div class="bass-muted">임대인이 등기부등본을 확인해 결과를 보내면, 계약 내용이 확정되고 최종 승인 단계로 넘어갑니다.</div>`;
    } else if (c.status === "registry_checked") {
      const r = c.registry || {};
      const warn = [!r.owner_match && "⚠️ 등기부 소유자와 임대인이 다릅니다", r.seizure && "⚠️ 압류 · 가압류가 있습니다"].filter(Boolean);
      html = `<strong>📑 등기부 확인 결과 · 계약 내용 확정</strong>
        <dl class="kv">
          <dt>열람일</dt><dd>${esc(r.viewed_on || "")}</dd>
          <dt>소유자</dt><dd>${esc(r.owner_name || "")} ${r.owner_match ? "✅ 임대인과 일치" : "❌ 불일치"}</dd>
          <dt>근저당 등</dt><dd>${r.mortgage ? won(r.mortgage) : "없음"}</dd>
          <dt>압류 · 가압류</dt><dd>${r.seizure ? "있음" : "없음"}</dd>
          ${r.note ? `<dt>메모</dt><dd style="white-space:pre-wrap">${esc(r.note)}</dd>` : ""}
        </dl>
        ${warn.length ? `<div style="color:var(--diff);font-weight:700">${warn.map(esc).join("<br>")}</div>` : ""}
        <div class="bass-row">${docBtn}${c.registry_file ? `<button class="bass-btn" type="button" data-go="registry">🗂 등기부 파일 보기</button>` : ""}</div>
        <form id="confirmForm" class="stack" style="gap:8px">
          <label style="display:flex;gap:8px;align-items:flex-start;font-size:14px"><input type="checkbox" id="fConfirm" style="margin-top:4px"> 확정 계약서와 등기 확인 결과를 확인했으며, 계약금 ${won(c.down_payment)}을 송금하겠습니다.</label>
          <button class="bass-btn bass-btn--primary" type="submit">최종 승인</button>
        </form>`;
    } else if (c.status === "tenant_confirmed") {
      html = `<strong>✅ 최종 승인했습니다 — 계약금 ${won(c.down_payment)} 송금</strong>
        <div class="bass-muted">임대인에게 받은 계좌로 계약금을 보내 주세요. 임대인이 입금을 확인하면 계약이 완료되고 입주 안내문이 옵니다.</div>
        <div class="bass-row">${docBtn}</div>`;
    } else if (c.status === "contracted") {
      html = `<strong>🎉 계약이 완료되었습니다 (계약금 확인 ${esc((c.down_paid_at || "").slice(0, 10))})</strong>
        <div class="bass-muted">입주일(${esc(c.start || "")})에 잔금 ${won(c.deposit - c.down_payment)} 확인 후 입주 처리되면, 내 계약 · 납입 화면이 열립니다.</div>
        <div class="bass-row">${docBtn}</div>
        ${c.guide_text ? `<div class="bass-card" style="white-space:pre-wrap;font-size:13.5px">${esc(c.guide_text)}</div>` : ""}`;
    } else if (c.status === "sent") {
      html = `<div class="bass-muted">${esc(LOGIN_HINT)}</div>`;
    } else if (c.status === "signed") {
      html = `<strong>✅ 계약에 동의했습니다 (${esc((c.signed_at || "").replace("T", " "))})</strong>
        <div class="bass-muted">${pay} 입금이 확인되면 계약이 체결됩니다. ${esc(LOGIN_HINT)}</div>`;
    } else if (c.status === "active") {
      html = `<strong>🎉 계약이 체결되었습니다 (${pay} 확인 ${esc((c.paid_at || "").slice(0, 10))})</strong>
        <div class="bass-muted">앞으로는 아이디 <b>${esc(c.final_username)}</b> 또는 휴대폰 번호와 지금 비밀번호로 로그인합니다.</div>
        <button class="bass-btn bass-btn--primary" data-go="continue" type="button">▶ 시작하기</button>`;
    } else if (c.status === "cancelled") {
      html = `<strong>이 계약은 취소되었습니다.</strong><div class="bass-muted">계약을 보낸 분에게 문의해 주세요.</div>`;
    }
    box.innerHTML = html;
    box.classList.toggle("hide", !html);
  }

  let current = null;

  // 회원 계약 절차: 정보 입력 · 최종 승인 · 등기부 파일
  $("stateCard").addEventListener("submit", (e) => {
    e.preventDefault();
    const form = e.target;
    const btn = form.querySelector("[type=submit]");
    if (form.id === "approveForm") {
      Bass.withLock(btn, async () => {
        const { contract } = await Bass.api("rent4", "/contract/mine/approve", { method: "POST", body: {
          agree: $("fAgree").checked, birth: $("fBirth").value, address: $("fAddr").value.trim(),
          emergency: $("fEmerg").value.trim(), start: $("fStart").value, period_months: Number($("fPeriod").value || 12) } });
        Bass.updateAppAlert("success", "정보를 입력하고 승인했습니다.", "임대인이 등기부 확인 결과를 보내면 알려 드립니다.");
        render(contract);
      }, "보내는 중...");
    }
    if (form.id === "confirmForm") {
      Bass.withLock(btn, async () => {
        const { contract } = await Bass.api("rent4", "/contract/mine/confirm", { method: "POST",
          body: { agree: $("fConfirm").checked, hash: current && current.snapshot_hash } });
        Bass.updateAppAlert("success", "최종 승인했습니다.", "계약금을 송금해 주세요. 임대인이 확인하면 계약이 완료됩니다.");
        render(contract);
      }, "보내는 중...");
    }
  });

  $("signForm").addEventListener("submit", (e) => {
    e.preventDefault();
    Bass.withLock($("btnSign"), async () => {
      const { contract } = await Bass.api("rent4", "/contract/mine/sign", { method: "POST", body: { agree: $("agree").checked } });
      Bass.updateAppAlert("success", "계약에 동의했습니다.", LOGIN_HINT);
      render(contract);
    }, "확인 중...");
  });

  $("stateCard").addEventListener("click", (e) => {
    const btn = e.target.closest("[data-go]");
    if (!btn) return;
    if (btn.dataset.go === "registry") {
      Bass.withLock(btn, () => Rent4.openFile(`/contracts/${encodeURIComponent(current.id)}/registry-file`));
      return;
    }
    Bass.withLock(btn, async () => {
      const r = await Bass.api("rent4", "/contract/mine/continue", { method: "POST" });
      Bass.setToken(r.token);
      location.replace(r.home);
    }, "시작하는 중...");
  });

  $("btnLogout").addEventListener("click", () => Rent4.logout());

  function failed() {
    $("kind").textContent = "계약을 열 수 없습니다";
  }

  if (Bass.token()) {
    Rent4.me().then((me) => {                     // 계약 진행 중인 사람만 — 다른 역할은 자기 화면으로
      if (me.kind !== "party") return Rent4.go(me.home);
      Rent4.startChat();                            // 임대인과 채팅 (신청 · 문의)
      return loadMine();
    }).catch((err) => {
      if (err.status === 401 || err.status === 403) { Bass.setToken(""); return Rent4.go("login.html"); }
      failed();
      Bass.showError(err);
    });
  } else {
    Rent4.go("login.html");
  }
})();
</script>
</body>
</html>
