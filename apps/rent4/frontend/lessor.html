<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Rent4 임대인</title>
  <meta name="description" content="은행 입금 문자 반영, 호실별 수납 현황, Excel 수납부 가져오기.">
  <link rel="stylesheet" href="/shared/ui/base.css">
  <link rel="stylesheet" href="rent4.css">
</head>
<body>
<main class="bass-container">
  <header class="top">
    <div>
      <h1><a href="./">🏢 Rent4 임대인</a></h1>
      <p class="sub bass-muted" id="who">로그인이 필요합니다</p>
    </div>
    <div class="bass-row">
      <a class="bass-btn bass-btn--sm bass-btn--ghost" href="manual.html">📘 설명서</a>
      <button class="bass-btn bass-btn--sm bass-btn--ghost hide" id="btnLogout">로그아웃</button>
    </div>
  </header>
  <div id="app-alert"></div>

  <!-- 로그인 -->
  <section id="loginBox" class="bass-card stack hide" style="max-width:420px">
    <h2 style="margin:0">임대인 로그인</h2>
    <form id="loginForm" class="stack">
      <div><label class="bass-label" for="username">아이디</label><input class="bass-input" id="username" autocomplete="username" required></div>
      <div><label class="bass-label" for="password">비밀번호</label><input class="bass-input" id="password" type="password" autocomplete="current-password" required></div>
      <button class="bass-btn bass-btn--primary" id="btnLogin" type="submit">로그인</button>
    </form>
  </section>

  <section id="workspace" class="hide">
    <nav class="tabs" role="tablist">
      <button class="bass-btn is-active" data-tab="bank" role="tab">💬 입금 문자 반영</button>
      <button class="bass-btn" data-tab="board" role="tab">📅 수납 현황</button>
      <button class="bass-btn" data-tab="import" role="tab">📥 Excel 가져오기</button>
    </nav>

    <!-- 입금 문자 -->
    <section class="panel stack" data-panel="bank">
      <div class="bass-card stack">
        <label class="bass-label" for="bankText">은행 입금 알림 문자를 그대로 붙여 넣으세요 (여러 건 가능, 문자 사이는 빈 줄)</label>
        <textarea class="bass-input" id="bankText" placeholder="[Web발신]&#10;신한 10/25 14:32&#10;110-***-123456&#10;입금 440,000&#10;잔액 3,456,789&#10;김수현"></textarea>
        <div class="bass-row">
          <button class="bass-btn bass-btn--primary" id="btnPreview">🔍 분석하기</button>
          <span class="bass-muted" style="font-size:12.5px">분석만 하고 저장하지 않습니다. 결과를 확인한 뒤 반영하세요.</span>
        </div>
      </div>
      <div id="previewBox" class="stack hide">
        <div class="bass-row" style="justify-content:space-between">
          <strong id="previewCount"></strong>
          <button class="bass-btn bass-btn--primary" id="btnCommit">✅ 체크한 입금 반영</button>
        </div>
        <div id="previewList" class="stack"></div>
      </div>
    </section>

    <!-- 수납 현황 -->
    <section class="panel stack" data-panel="board" hidden>
      <div class="bass-row">
        <button class="bass-btn bass-btn--sm" id="prevYear">◀</button>
        <strong id="yearLabel" style="font-size:18px"></strong>
        <button class="bass-btn bass-btn--sm" id="nextYear">▶</button>
      </div>
      <div class="stats" id="boardStats"></div>
      <div class="board-wrap"><table class="board" id="board"></table></div>
      <div class="legend">
        <span><i style="background:hsl(152 65% 40% / .5)"></i>입금 (금액 만원)</span>
        <span><i style="background:hsl(356 85% 55% / .5)"></i>미납</span>
        <span><i style="background:hsl(44 96% 50% / .4)"></i>이번 달 대기</span>
        <span><i style="border:1px solid hsl(152 65% 50%)"></i>입금 문자로 반영</span>
        <span>흐린 칸: 현 임차인 입주 전 · <b style="color:var(--diff)">!</b> 확인 필요</span>
      </div>
    </section>

    <!-- Excel 가져오기 -->
    <section class="panel stack" data-panel="import" hidden>
      <div class="bass-card stack">
        <label class="bass-label" for="excelText">연간 수납부 Excel 에서 제목 행("2026년도")부터 합계 행까지 선택해 복사한 뒤 붙여 넣으세요</label>
        <textarea class="bass-input" id="excelText" placeholder="2026년도&#10;호실	세입자명	주민번호	전화번호 ..."></textarea>
        <p class="bass-muted" style="margin:0;font-size:12.5px">🔒 주민번호 칸은 읽지 않으며 저장하지 않습니다. 같은 연도를 다시 가져오면 Excel 출처 기록만 교체되고, 입금 문자로 반영한 기록은 그대로 둡니다.</p>
        <div class="bass-row">
          <button class="bass-btn" id="btnImportPreview">🔍 분석하기</button>
          <button class="bass-btn bass-btn--primary" id="btnImportCommit" disabled>📥 Knowledge Pool 에 반영</button>
        </div>
      </div>
      <div id="importResult" class="bass-card stack hide"></div>
    </section>
  </section>

  <dialog class="detail" id="detail"></dialog>
</main>
<script src="/shared/ui/bass.js"></script>
<script src="lessor.js"></script>
</body>
</html>
