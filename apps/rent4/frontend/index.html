<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Rent4 로그인</title>
  <meta name="description" content="관리인 · 임대인 · 임차인 로그인. 로그인하면 역할에 맞는 화면으로 이동합니다.">
  <link rel="stylesheet" href="/shared/ui/base.css">
  <link rel="stylesheet" href="rent4.css">
</head>
<body>
<main class="bass-container" style="max-width:460px">
  <header class="top">
    <div>
      <h1>🏠 <span class="bass-gradient-text">Rent4</span> 입금 수납부</h1>
      <p class="sub bass-muted">은행 입금 문자로 쌓이는 월세 수납 기록</p>
    </div>
  </header>
  <div id="app-alert"></div>

  <form id="loginForm" class="bass-card stack" style="margin-top:12px">
    <h2 style="margin:0">로그인</h2>
    <div><label class="bass-label" for="username">아이디</label>
      <input class="bass-input" id="username" autocomplete="username" autocapitalize="none" placeholder="예: chic603" required></div>
    <div><label class="bass-label" for="password">비밀번호</label>
      <input class="bass-input" id="password" type="password" autocomplete="current-password" required></div>
    <button class="bass-btn bass-btn--primary" id="btnLogin" type="submit">로그인</button>
  </form>

  <div class="bass-card stack" style="margin-top:14px;font-size:13.5px">
    <div><b>📝 처음이신가요?</b><br><span class="bass-muted">계정은 계약이 체결되면 생깁니다. 받은 <b>계약 링크</b>에서 계약 내용을 확인·동의하고, 가맹비(임대인) 또는 잔금(임차인)이 확인되면 같은 링크에 아이디와 임시 비밀번호가 나타납니다. 처음 로그인할 때 새 비밀번호로 바꿉니다.</span></div>
    <div><b>🔑 아이디</b><br><span class="bass-muted">임대인 = 건물 코드(예: <code>chic</code>) · 임차인 = 건물 코드 + 호실(예: <code>chic603</code>)</span></div>
    <a class="bass-muted" href="manual.html">📘 사용 설명서</a>
  </div>
</main>
<script src="/shared/ui/bass.js"></script>
<script src="rent4.js"></script>
<script>
(function () {
  "use strict";
  const $ = (id) => document.getElementById(id);

  async function goHome() {
    const info = await Rent4.me();
    Rent4.go(info.home);
  }

  if (Bass.token()) goHome().catch(() => Bass.setToken(""));

  $("loginForm").addEventListener("submit", (e) => {
    e.preventDefault();
    Bass.withLock($("btnLogin"), async () => {
      const res = await Bass.request("/auth/login", { method: "POST",
        body: { username: $("username").value.trim(), password: $("password").value } });
      Bass.setToken(res.token);
      try {
        await goHome();
      } catch (err) {
        Bass.setToken("");
        throw err;
      }
    }, "로그인 중...");
  });
})();
</script>
</body>
</html>
