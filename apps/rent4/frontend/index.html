<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Rent4 매물</title>
  <meta name="description" content="지금 계약할 수 있는 방. 매물을 고르면 회원가입 · 로그인 후 바로 계약을 신청합니다.">
  <link rel="stylesheet" href="/shared/ui/base.css">
  <link rel="stylesheet" href="rent4.css">
  <style>
    /* 로그인 모달 스타일 */
    .modal-overlay {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0, 0, 0, 0.65);
      backdrop-filter: blur(4px);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 9999;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s ease;
      padding: 16px;
    }
    .modal-overlay.active {
      opacity: 1;
      pointer-events: auto;
    }
    .modal-window {
      background: var(--bass-surface, #1e222d);
      border: 1px solid var(--bass-border, #2d3343);
      border-radius: 14px;
      width: 100%;
      max-width: 480px;
      height: 600px;
      max-height: 90vh;
      display: flex;
      flex-direction: column;
      box-shadow: 0 16px 36px rgba(0, 0, 0, 0.45);
      overflow: hidden;
      transform: translateY(12px) scale(0.97);
      transition: transform 0.2s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .modal-overlay.active .modal-window {
      transform: translateY(0) scale(1);
    }
    .modal-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 18px;
      border-bottom: 1px solid var(--bass-border, #2d3343);
      background: rgba(255, 255, 255, 0.02);
    }
    .modal-header h3 {
      margin: 0;
      font-size: 16px;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .modal-close {
      background: transparent;
      border: none;
      color: var(--bass-muted, #94a3b8);
      font-size: 20px;
      cursor: pointer;
      padding: 4px 8px;
      border-radius: 6px;
      line-height: 1;
    }
    .modal-close:hover {
      color: #fff;
      background: rgba(255, 255, 255, 0.08);
    }
    .modal-body {
      flex: 1;
      width: 100%;
      height: 100%;
      position: relative;
    }
    .modal-body iframe {
      width: 100%;
      height: 100%;
      border: none;
    }
  </style>
</head>
<body>
<main class="bass-container" style="max-width:820px">
  <header class="top">
    <div>
      <h1>🏠 <span class="bass-gradient-text">Rent4</span> 매물</h1>
      <p class="sub bass-muted">지금 계약할 수 있는 방</p>
    </div>
    <div class="bass-row" id="topActions">
      <a class="bass-btn bass-btn--sm" href="signup.html">회원가입</a>
      <button class="bass-btn bass-btn--sm bass-btn--primary" id="btnOpenLogin">로그인</button>
    </div>
  </header>
  <div id="app-alert"></div>

  <div class="bass-row" style="gap:8px;margin:6px 0 14px" id="filters"></div>
  <section class="listing-grid" id="listings"><div class="bass-muted">불러오는 중...</div></section>
</main>

<!-- 로그인 모달 창 -->
<div class="modal-overlay" id="loginModal">
  <div class="modal-window">
    <div class="modal-header">
      <h3>🔑 Rent4 로그인</h3>
      <button class="modal-close" id="btnCloseLogin" title="닫기">&times;</button>
    </div>
    <div class="modal-body">
      <iframe id="loginFrame" src="" title="Rent4 로그인"></iframe>
    </div>
  </div>
</div>

<script src="/shared/ui/bass.js"></script>
<script src="rent4.js"></script>
<script>
(function () {
  "use strict";
  const $ = (id) => document.getElementById(id);
  const esc = Bass.escapeHtml;
  const man = (n) => {
    const v = Number(n || 0) / 10000;
    return `${v.toLocaleString("ko-KR", { maximumFractionDigits: 1 })}만`;
  };
  let all = [];
  let building = "";

  // 모달 제어
  const modal = $("loginModal");
  const iframe = $("loginFrame");

  function openLoginModal() {
    if (!iframe.src || iframe.src === "about:blank") {
      iframe.src = "login.html";
    }
    modal.classList.add("active");
  }

  function closeLoginModal() {
    modal.classList.remove("active");
  }

  $("btnOpenLogin")?.addEventListener("click", openLoginModal);
  $("btnCloseLogin")?.addEventListener("click", closeLoginModal);
  modal.addEventListener("click", (e) => {
    if (e.target === modal) closeLoginModal();
  });
  window.addEventListener("keydown", (e) => {
    if (e.key === "Escape" && modal.classList.contains("active")) {
      closeLoginModal();
    }
  });

  // iframe 내부에서 로그인 완료 시 부모 창 갱신 또는 리디렉션 수신
  window.addEventListener("message", (e) => {
    if (e.data && e.data.type === "rent4_login_success") {
      closeLoginModal();
      if (e.data.home) {
        location.href = e.data.home;
      } else {
        location.reload();
      }
    }
  });

  // 로그인한 사람에게는 [내 화면]
  if (Bass.token()) {
    Rent4.me().then((me) => {
      $("topActions").innerHTML = `<a class="bass-btn bass-btn--sm bass-btn--primary" href="${esc(me.home)}">내 화면 →</a>`;
    }).catch(() => Bass.setToken(""));
  }

  function render() {
    const items = all.filter((l) => !building || l.building === building);
    $("listings").innerHTML = items.length ? items.map((l) => `
      <article class="bass-card stack listing" style="gap:8px">
        <div class="bass-row" style="justify-content:space-between">
          <strong style="font-size:17px">${esc(l.building)} ${esc(l.room)}호</strong>
          <span class="bass-badge bass-badge--info">${esc(l.lease_type)} · ${esc(l.pay_timing)}</span>
        </div>
        <div class="listing-price">${l.lease_type === "전세" ? `전세 <b>${man(l.deposit)}</b>`
          : `보증금 <b>${man(l.deposit)}</b> / 월 <b>${man(l.monthly)}</b>`}</div>
        <div class="bass-muted" style="font-size:13px">${l.lease_type === "전세" ? "" : `월세 ${man(l.rent)} + 관리비 ${man(l.mgmt)} · `}입주 ${esc(l.available_from || "협의")}</div>
        ${l.description ? `<p style="margin:0;font-size:13.5px;white-space:pre-wrap">${esc(l.description)}</p>` : ""}
        <a class="bass-btn bass-btn--primary" style="justify-self:start" href="apply.html?listing=${encodeURIComponent(l.id)}">📝 계약 신청</a>
      </article>`).join("")
      : `<div class="bass-card bass-muted">지금 공개된 매물이 없습니다.</div>`;
  }

  Bass.api("rent4", "/listings").then(({ listings }) => {
    all = listings;
    const names = [...new Set(listings.map((l) => l.building))];
    if (names.length > 1) {
      $("filters").innerHTML = ["", ...names].map((n) =>
        `<button class="bass-btn bass-btn--sm ${n === building ? "bass-btn--primary" : ""}" data-b="${esc(n)}">${esc(n || "전체")}</button>`).join("");
      $("filters").addEventListener("click", (e) => {
        const b = e.target.closest("[data-b]");
        if (!b) return;
        building = b.dataset.b;
        $("filters").querySelectorAll("[data-b]").forEach((x) => x.classList.toggle("bass-btn--primary", x === b));
        render();
      });
    }
    render();
  }).catch(Bass.showError);
})();
</script>
</body>
</html>
