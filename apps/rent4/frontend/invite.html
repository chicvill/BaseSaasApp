<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Rent4 입금 확인 안내</title>
  <meta name="description" content="임대인이 보낸 안내 링크에서 본인 확인 후 아이디와 임시 비밀번호를 받습니다.">
  <link rel="stylesheet" href="/shared/ui/base.css">
  <link rel="stylesheet" href="rent4.css">
  <style>
    dl.terms { display: grid; grid-template-columns: 110px 1fr; gap: 8px 12px; margin: 0; font-size: 14px; }
    dl.terms dt { color: var(--muted); }
    dl.terms dd { margin: 0; }
    .cred { font: 700 20px ui-monospace, Consolas, monospace; letter-spacing: .04em; }
  </style>
</head>
<body>
<main class="bass-container" style="max-width:520px">
  <header class="top">
    <div>
      <h1>🔑 입금 확인 안내</h1>
      <p class="sub bass-muted" id="sub">불러오는 중...</p>
    </div>
  </header>
  <div id="app-alert"></div>

  <form id="openForm" class="bass-card stack hide">
    <div id="greeting" style="font-size:15px"></div>
    <p class="bass-muted" style="margin:0;font-size:13.5px">임대인에게 등록한 휴대폰 <b id="maskedPhone"></b> 의 뒤 4자리를 입력하면 아이디와 임시 비밀번호가 나타납니다.</p>
    <div><label class="bass-label" for="phone4">휴대폰 뒤 4자리</label>
      <input class="bass-input" id="phone4" inputmode="numeric" maxlength="4" pattern="\d{4}" required></div>
    <button class="bass-btn bass-btn--primary" id="btnOpen" type="submit">본인 확인</button>
  </form>

  <div id="result" class="bass-card stack hide"></div>
</main>
<script src="/shared/ui/bass.js"></script>
<script>
(function () {
  "use strict";
  const $ = (id) => document.getElementById(id);
  const esc = Bass.escapeHtml;
  const token = new URLSearchParams(location.search).get("t") || "";

  function failed() { $("sub").textContent = "안내 링크를 열 수 없습니다"; }

  async function load() {
    const v = await Bass.api("rent4", `/invite/view?t=${encodeURIComponent(token)}`);
    $("sub").textContent = `${v.building} ${v.room}호`;
    if (v.activated) return showDone();
    $("greeting").innerHTML = `<b>${esc(v.tenant_name)}</b>님, ${esc(v.building)} ${esc(v.room)}호의 월세·관리비 입금 내역을 온라인으로 확인할 수 있습니다.`;
    $("maskedPhone").textContent = v.phone_masked;
    $("openForm").classList.remove("hide");
  }

  function showDone() {
    $("openForm").classList.add("hide");
    $("result").classList.remove("hide");
    $("result").innerHTML = `<strong>이미 계정을 쓰고 계십니다.</strong>
      <div class="bass-muted">비밀번호를 잊으셨다면 임대인에게 '비밀번호 초기화'를 요청하세요.</div>
      <a class="bass-btn bass-btn--primary" href="index.html">로그인하러 가기</a>`;
  }

  $("openForm").addEventListener("submit", (e) => {
    e.preventDefault();
    Bass.withLock($("btnOpen"), async () => {
      const r = await Bass.api("rent4", "/invite/open", { method: "POST", body: { t: token, phone4: $("phone4").value.trim() } });
      if (r.activated) return showDone();
      $("openForm").classList.add("hide");
      $("result").classList.remove("hide");
      $("result").innerHTML = `<strong>✅ 본인 확인이 끝났습니다</strong>
        <div class="bass-muted">아래 아이디와 임시 비밀번호로 로그인한 뒤, 바로 새 비밀번호로 바꿔 주세요. 임시 비밀번호는 바꾸는 즉시 사라집니다.</div>
        <dl class="terms"><dt>아이디</dt><dd class="cred">${esc(r.username)}</dd><dt>임시 비밀번호</dt><dd class="cred">${esc(r.temp_password)}</dd></dl>
        <a class="bass-btn bass-btn--primary" href="index.html">로그인하러 가기</a>`;
    }, "확인 중...");
  });

  if (!token) {
    failed();
    Bass.updateAppAlert("error", "안내 링크가 올바르지 않습니다.", "받은 링크 전체를 그대로 열어 주세요.");
  } else {
    load().catch((err) => { failed(); Bass.showError(err); });
  }
})();
</script>
</body>
</html>
