<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Rent4 관리인 설정</title>
  <meta name="description" content="서버에서 발급한 설정 링크로 관리인 아이디와 임시 비밀번호를 확인합니다.">
  <link rel="stylesheet" href="/shared/ui/base.css">
  <link rel="stylesheet" href="rent4.css">
  <style>
    dl.terms { display: grid; grid-template-columns: 110px 1fr; gap: 8px 12px; margin: 0; font-size: 14px; }
    dl.terms dt { color: var(--muted); }
    dl.terms dd { margin: 0; }
    .cred { font: 700 20px ui-monospace, Consolas, monospace; letter-spacing: .04em; }
  </style>
</head>
<body>
<main class="bass-container" style="max-width:520px">
  <header class="top">
    <div>
      <h1>👑 관리인 설정</h1>
      <p class="sub bass-muted" id="sub">불러오는 중...</p>
    </div>
  </header>
  <div id="app-alert"></div>
  <div id="result" class="bass-card stack hide"></div>
</main>
<script src="/shared/ui/bass.js"></script>
<script>
(function () {
  "use strict";
  const $ = (id) => document.getElementById(id);
  const esc = Bass.escapeHtml;
  const token = new URLSearchParams(location.search).get("t") || "";

  function failed() { $("sub").textContent = "설정 링크를 열 수 없습니다"; }

  async function load() {
    const r = await Bass.api("rent4", `/setup/view?t=${encodeURIComponent(token)}`);
    $("sub").textContent = "Rent4 관리인 계정";
    $("result").classList.remove("hide");
    $("result").innerHTML = r.activated
      ? `<strong>이미 비밀번호를 정하셨습니다.</strong>
         <div class="bass-muted">비밀번호를 잊었다면 서버에서 설정 링크를 다시 만드세요.</div>
         <a class="bass-btn bass-btn--primary" href="index.html">로그인하러 가기</a>`
      : `<strong>🔑 관리인 임시 비밀번호</strong>
         <div class="bass-muted">아래 아이디와 임시 비밀번호로 로그인한 뒤, 바로 새 비밀번호(8자 이상)로 바꿔 주세요. 바꾸는 즉시 이 링크의 임시 비밀번호는 사라집니다.</div>
         <dl class="terms"><dt>아이디</dt><dd class="cred">${esc(r.username)}</dd><dt>임시 비밀번호</dt><dd class="cred">${esc(r.temp_password)}</dd></dl>
         <a class="bass-btn bass-btn--primary" href="index.html">로그인하러 가기</a>`;
  }

  if (!token) {
    failed();
    Bass.updateAppAlert("error", "설정 링크가 올바르지 않습니다.", "서버에서 받은 링크 전체를 그대로 열어 주세요.");
  } else {
    load().catch((err) => { failed(); Bass.showError(err); });
  }
})();
</script>
</body>
</html>
