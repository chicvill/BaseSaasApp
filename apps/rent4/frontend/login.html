<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Rent4 로그인</title>
  <meta name="description" content="관리인 · 임대인 · 임차인 로그인. 로그인하면 역할에 맞는 화면으로 이동합니다.">
  <link rel="stylesheet" href="/shared/ui/base.css">
  <link rel="stylesheet" href="rent4.css">
</head>
<body>
<main class="bass-container" style="max-width:460px">
  <header class="top">
    <div>
      <h1>🏠 <span class="bass-gradient-text">Rent4</span> 입금 수납부</h1>
      <p class="sub bass-muted">은행 입금 문자로 쌓이는 월세 수납 기록</p>
    </div>
  </header>
  <div id="app-alert"></div>

  <form id="loginForm" class="bass-card stack" style="margin-top:12px">
    <h2 style="margin:0">로그인</h2>
    <div><label class="bass-label" for="username">아이디 또는 휴대폰 번호</label>
      <input class="bass-input" id="username" autocomplete="username" autocapitalize="none" placeholder="예: chic603 또는 010-1234-5678" required></div>
    <div><label class="bass-label" for="password">비밀번호</label>
      <input class="bass-input" id="password" type="password" autocomplete="current-password" required></div>
    <div class="bass-row" style="justify-content:space-between;font-size:13.5px">
      <label><input type="checkbox" id="rememberId"> 아이디 저장</label>
      <span><a href="find.html#mode=id">아이디 찾기</a> · <a href="find.html#mode=pw">비밀번호 찾기</a></span>
    </div>
    <button class="bass-btn bass-btn--primary" id="btnLogin" type="submit">로그인</button>
    <div class="bass-row hide" id="socialRow" style="gap:8px"></div>
  </form>

  <div class="bass-card stack" style="margin-top:14px;font-size:13.5px">
    <div><b>📝 처음이신가요?</b><br><span class="bass-muted">계약할 때 받은 계약 시작 링크에서 비밀번호를 정합니다. 비밀번호를 잊으면 위의 '비밀번호 찾기'(구글 연결한 분) 또는 임대인에게 '비밀번호 초기화'를 요청하세요.</span></div>
    <div><b>🔑 아이디</b><br><span class="bass-muted">임대인 = 건물 코드(예: <code>chic</code>) · 임차인 = 건물 코드 + 호실(예: <code>chic603</code>) · 휴대폰 번호로도 로그인할 수 있습니다</span></div>

  </div>
</main>
<script src="/shared/ui/bass.js"></script>
<script src="rent4.js"></script>
<script>
(function () {
  "use strict";
  const $ = (id) => document.getElementById(id);

  async function goHome() {
    const info = await Rent4.me();
    let listing = "";                              // 매물에서 [계약 신청]을 누르고 로그인하러 온 회원
    try { listing = sessionStorage.getItem("rent4.applyListing") || ""; } catch (_) { listing = ""; }
    const target = (listing && info.kind === "member") ? `apply.html?listing=${encodeURIComponent(listing)}` : info.home;
    if (window.parent && window.parent !== window) {
      window.parent.postMessage({ type: "rent4_login_success", home: target }, "*");
    } else {
      Rent4.go(target);
    }
  }

  // 아이디 저장 (이 기기의 브라우저에만, 비밀번호는 저장하지 않음) · 아이디 찾기에서 돌아오면 찾은 아이디
  const KEY = "rent4.savedId";
  const store = { get() { try { return localStorage.getItem(KEY) || ""; } catch (_) { return ""; } },
    set(v) { try { v ? localStorage.setItem(KEY, v) : localStorage.removeItem(KEY); } catch (_) {} } };
  const foundId = (location.hash.match(/id=([^&]+)/) || [])[1];
  const saved = store.get();
  $("rememberId").checked = !!saved;
  const prefill = foundId ? decodeURIComponent(foundId) : saved;
  if (prefill) {
    $("username").value = prefill;
    $("password").focus();
  }
  if (foundId) {
    if ($("rememberId").checked) store.set(prefill);
    Bass.updateAppAlert("success", "아이디를 찾았습니다.", "비밀번호를 입력해 로그인하세요.");
  }
  $("rememberId").addEventListener("change", () => { if (!$("rememberId").checked) store.set(""); });

  const hash = location.hash;
  const linkedToken = (hash.match(/token=([^&]+)/) || [])[1];
  const oauthResult = (hash.match(/oauth=(\w+)/) || [])[1];
  if (hash) history.replaceState(null, "", location.pathname);
  if (linkedToken) Bass.setToken(decodeURIComponent(linkedToken));
  if (oauthResult === "unlinked") Bass.updateAppAlert("warning", "아직 연결되지 않은 계정입니다.",
    "먼저 휴대폰 번호로 로그인한 뒤 계약 화면에서 카카오·구글 본인 확인을 하면, 다음부터 이 버튼으로 로그인할 수 있습니다.");
  if (oauthResult === "expired") Bass.updateAppAlert("warning", "로그인 시간이 지났습니다.", "다시 시도해 주세요.");

  Bass.api("rent4", "/oauth/providers").then(({ providers }) => {
    if (!providers.length) return;
    const row = $("socialRow");
    row.innerHTML = providers.map((p) =>
      `<button class="bass-btn" type="button" data-provider="${Bass.escapeHtml(p.id)}" style="flex:1">${Bass.escapeHtml(p.label)}로 로그인</button>`).join("");
    row.classList.remove("hide");
    row.addEventListener("click", (e) => {
      const btn = e.target.closest("[data-provider]");
      if (!btn) return;
      Bass.withLock(btn, async () => {
        const r = await Bass.api("rent4", `/oauth/${btn.dataset.provider}/start`, { method: "POST", body: { purpose: "login" } });
        location.href = r.url;
      }, "이동 중...");
    });
  }).catch(() => {});

  if (Bass.token()) goHome().catch(() => Bass.setToken(""));

  $("loginForm").addEventListener("submit", (e) => {
    e.preventDefault();
    Bass.withLock($("btnLogin"), async () => {
      const res = await Bass.api("rent4", "/login", { method: "POST",
        body: { username: $("username").value.trim(), password: $("password").value } });
      store.set($("rememberId").checked ? $("username").value.trim() : "");
      Bass.setToken(res.token);
      try {
        await goHome();
      } catch (err) {
        Bass.setToken("");
        throw err;
      }
    }, "로그인 중...");
  });
})();
</script>
</body>
</html>
