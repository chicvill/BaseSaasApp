<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Rent4 비밀번호 설정</title>
  <meta name="description" content="휴대폰 번호와 문자 인증번호로 비밀번호를 처음 정하거나 다시 정합니다.">
  <link rel="stylesheet" href="/shared/ui/base.css">
  <link rel="stylesheet" href="rent4.css">
</head>
<body>
<main class="bass-container" style="max-width:460px">
  <header class="top">
    <div>
      <h1>📱 비밀번호 설정</h1>
      <p class="sub bass-muted">처음 시작할 때도, 비밀번호를 잊었을 때도 여기서 합니다.</p>
    </div>
  </header>
  <div id="app-alert"></div>

  <form id="phoneForm" class="bass-card stack">
    <div><label class="bass-label" for="phone">계약할 때 알려 준 휴대폰 번호</label>
      <input class="bass-input" id="phone" inputmode="tel" autocomplete="tel" placeholder="010-0000-0000" required></div>
    <button class="bass-btn bass-btn--primary" id="btnCode" type="submit">인증번호 받기</button>
  </form>

  <form id="setForm" class="bass-card stack hide" style="margin-top:12px">
    <div class="bass-muted" style="font-size:13.5px" id="sentNote"></div>
    <div><label class="bass-label" for="code">문자로 받은 인증번호 (6자리, 5분 안에)</label>
      <input class="bass-input" id="code" inputmode="numeric" autocomplete="one-time-code" maxlength="6" pattern="\d{6}" required></div>
    <div><label class="bass-label" for="pw1">새 비밀번호 (6자 이상)</label>
      <input class="bass-input" id="pw1" type="password" autocomplete="new-password" minlength="6" required></div>
    <div><label class="bass-label" for="pw2">새 비밀번호 확인</label>
      <input class="bass-input" id="pw2" type="password" autocomplete="new-password" minlength="6" required></div>
    <button class="bass-btn bass-btn--primary" id="btnSet" type="submit">비밀번호 정하고 시작</button>
    <button class="bass-btn bass-btn--ghost" id="btnResend" type="button">인증번호 다시 받기</button>
  </form>

  <p style="margin-top:14px"><a class="bass-muted" href="index.html">← 로그인으로</a></p>
</main>
<script src="/shared/ui/bass.js"></script>
<script src="rent4.js"></script>
<script>
(function () {
  "use strict";
  const $ = (id) => document.getElementById(id);

  async function requestCode(btn) {
    await Bass.withLock(btn, async () => {
      const r = await Bass.api("rent4", "/otp/request", { method: "POST", body: { phone: $("phone").value.trim() } });
      $("setForm").classList.remove("hide");
      $("sentNote").textContent = r.dev_mode
        ? "개발 모드: 실제 문자 대신 서버 로그에 인증번호가 남습니다."
        : `${$("phone").value.trim()} 로 인증번호를 보냈습니다.`;
      $("code").focus();
    }, "보내는 중...");
  }

  $("phoneForm").addEventListener("submit", (e) => { e.preventDefault(); requestCode($("btnCode")); });
  $("btnResend").addEventListener("click", (e) => requestCode(e.currentTarget));

  $("setForm").addEventListener("submit", (e) => {
    e.preventDefault();
    if ($("pw1").value !== $("pw2").value) {
      Bass.updateAppAlert("diff", "비밀번호 두 칸이 서로 다릅니다.", "같은 비밀번호를 두 번 입력해 주세요.");
      return;
    }
    Bass.withLock($("btnSet"), async () => {
      const r = await Bass.api("rent4", "/otp/set-password", { method: "POST",
        body: { phone: $("phone").value.trim(), code: $("code").value.trim(), new: $("pw1").value } });
      Bass.setToken(r.token);
      location.replace(r.home);
    }, "저장 중...");
  });
})();
</script>
</body>
</html>
