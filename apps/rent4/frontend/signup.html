<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Rent4 회원가입</title>
  <meta name="description" content="구글 본인 확인 후 이름 · 휴대폰 · 아이디 · 비밀번호로 가입합니다. 이미 회원이면 바로 로그인됩니다.">
  <link rel="stylesheet" href="/shared/ui/base.css">
  <link rel="stylesheet" href="rent4.css">
</head>
<body>
<main class="bass-container" style="max-width:460px">
  <header class="top">
    <div>
      <h1>📝 <span class="bass-gradient-text">회원가입</span></h1>
      <p class="sub bass-muted">구글 본인 확인 → 정보 입력</p>
    </div>
    <a class="bass-btn bass-btn--sm bass-btn--ghost" href="index.html">← 매물</a>
  </header>
  <div id="app-alert"></div>

  <section id="stepGoogle" class="bass-card stack hide">
    <p style="margin:0;font-size:13.5px">본인 확인을 위해 <b>구글 계정</b>으로 시작합니다. 이미 가입한 구글 계정이면 가입을 건너뛰고 바로 로그인됩니다.</p>
    <button class="bass-btn bass-btn--primary" id="btnGoogle" type="button">구글로 본인 확인</button>
    <p class="bass-muted" style="margin:0;font-size:12.5px">이 구글 계정은 나중에 아이디 · 비밀번호를 잊었을 때 본인 확인에도 쓰입니다.</p>
  </section>

  <form id="stepForm" class="bass-card stack hide">
    <p class="bass-muted" style="margin:0;font-size:13.5px" id="googleNote">✅ 구글 본인 확인 완료 · 10분 안에 입력해 주세요.</p>
    <div><label class="bass-label" for="sName">이름</label>
      <input class="bass-input" id="sName" autocomplete="name" required></div>
    <div><label class="bass-label" for="sPhone">휴대폰 번호</label>
      <input class="bass-input" id="sPhone" type="tel" autocomplete="tel" placeholder="010-1234-5678" required></div>
    <div><label class="bass-label" for="sUser">아이디 (영문 소문자 · 숫자 · _ 4~20자)</label>
      <input class="bass-input" id="sUser" autocomplete="username" autocapitalize="none" pattern="[a-z][a-z0-9_]{3,19}" required></div>
    <div><label class="bass-label" for="sPw">비밀번호 (6자 이상)</label>
      <input class="bass-input" id="sPw" type="password" autocomplete="new-password" minlength="6" required></div>
    <div><label class="bass-label" for="sPw2">비밀번호 확인</label>
      <input class="bass-input" id="sPw2" type="password" autocomplete="new-password" minlength="6" required></div>
    <button class="bass-btn bass-btn--primary" id="btnSignup" type="submit">가입하고 시작</button>
    <p class="bass-muted" style="margin:0;font-size:12.5px">비밀번호는 암호화(해시)되어 저장되며 누구도 볼 수 없습니다. 주민번호는 받지 않습니다.</p>
  </form>
</main>
<script src="/shared/ui/bass.js"></script>
<script src="rent4.js"></script>
<script>
(function () {
  "use strict";
  const $ = (id) => document.getElementById(id);
  const hash = location.hash;
  const token = (hash.match(/[#&]token=([^&]+)/) || [])[1];
  const s = (hash.match(/[#&]s=([^&]+)/) || [])[1] || "";
  const oauthResult = (hash.match(/oauth=(\w+)/) || [])[1];
  if (hash) history.replaceState(null, "", location.pathname);
  if (oauthResult === "expired") Bass.updateAppAlert("warning", "본인 확인 시간이 지났습니다.", "다시 시도해 주세요.");

  /** 가입 · 로그인 뒤: 신청하려던 매물이 있으면 그 계약 신청으로, 아니면 매물 목록으로. */
  function next() {
    let listing = "";
    try { listing = sessionStorage.getItem("rent4.applyListing") || ""; } catch (_) { listing = ""; }
    location.replace(listing ? `apply.html?listing=${encodeURIComponent(listing)}` : "index.html");
  }

  if (token) {                                   // 이미 가입한 구글 계정 → 가입 건너뜀
    Bass.setToken(decodeURIComponent(token));
    next();
    return;
  }

  async function boot() {
    if (s) {
      try {
        const v = await Bass.api("rent4", `/signup/view?s=${encodeURIComponent(s)}`);
        $("sName").value = v.name || "";
        if (v.email) $("googleNote").textContent = `✅ 구글 본인 확인 완료 (${v.email}) · 10분 안에 입력해 주세요.`;
        $("stepForm").classList.remove("hide");
        $(v.name ? "sPhone" : "sName").focus();
        return;
      } catch (err) {
        Bass.showError(err);
      }
    }
    $("stepGoogle").classList.remove("hide");
    const { providers } = await Bass.api("rent4", "/oauth/providers");
    if (!providers.some((p) => p.id === "google")) {
      $("btnGoogle").disabled = true;
      Bass.updateAppAlert("warning", "구글 본인 확인이 아직 설정되지 않아 가입할 수 없습니다.", "관리인에게 문의해 주세요.");
    }
  }

  $("btnGoogle").addEventListener("click", () => Bass.withLock($("btnGoogle"), async () => {
    const r = await Bass.api("rent4", "/oauth/google/start", { method: "POST", body: { purpose: "signup" } });
    location.href = r.url;
  }, "이동 중..."));

  $("stepForm").addEventListener("submit", (e) => {
    e.preventDefault();
    if ($("sPw").value !== $("sPw2").value) {
      Bass.updateAppAlert("diff", "비밀번호 두 칸이 서로 다릅니다.", "같은 비밀번호를 두 번 입력해 주세요.");
      return;
    }
    Bass.withLock($("btnSignup"), async () => {
      const r = await Bass.api("rent4", "/signup", { method: "POST", body: {
        s, name: $("sName").value.trim(), phone: $("sPhone").value.trim(),
        username: $("sUser").value.trim(), password: $("sPw").value } });
      Bass.setToken(r.token);
      next();
    }, "가입 중...");
  });

  boot().catch(Bass.showError);
})();
</script>
</body>
</html>
