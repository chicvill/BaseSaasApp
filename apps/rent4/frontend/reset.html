<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Rent4 새 비밀번호</title>
  <meta name="description" content="임대인이 보낸 재설정 링크에서 새 비밀번호를 정하고 바로 시작합니다.">
  <link rel="stylesheet" href="/shared/ui/base.css">
  <link rel="stylesheet" href="rent4.css">
</head>
<body>
<main class="bass-container" style="max-width:460px">
  <header class="top">
    <div>
      <h1>🔑 새 비밀번호</h1>
      <p class="sub bass-muted" id="sub">불러오는 중...</p>
    </div>
  </header>
  <div id="app-alert"></div>

  <form id="setForm" class="bass-card stack hide">
    <div id="greeting" style="font-size:15px"></div>
    <div><label class="bass-label" for="pw1">새 비밀번호 (6자 이상)</label>
      <input class="bass-input" id="pw1" type="password" autocomplete="new-password" minlength="6" required></div>
    <div><label class="bass-label" for="pw2">새 비밀번호 확인</label>
      <input class="bass-input" id="pw2" type="password" autocomplete="new-password" minlength="6" required></div>
    <button class="bass-btn bass-btn--primary" id="btnSet" type="submit">비밀번호 정하고 시작</button>
    <p class="bass-muted" style="margin:0;font-size:12.5px">비밀번호는 암호화(해시)되어 저장되고, 임대인을 포함해 누구도 볼 수 없습니다. 이 링크는 정하는 즉시 만료됩니다.</p>
  </form>

  <p style="margin-top:14px"><a class="bass-muted" href="index.html">← 로그인으로</a></p>
</main>
<script src="/shared/ui/bass.js"></script>
<script src="rent4.js"></script>
<script>
(function () {
  "use strict";
  const $ = (id) => document.getElementById(id);
  const esc = Bass.escapeHtml;
  const token = new URLSearchParams(location.search).get("t") || "";

  function failed() { $("sub").textContent = "링크를 열 수 없습니다"; }

  async function load() {
    const v = await Bass.api("rent4", `/reset/view?t=${encodeURIComponent(token)}`);
    $("sub").textContent = `${v.building} ${v.room}호`;
    $("greeting").innerHTML = `<b>${esc(v.tenant_name)}</b>님, 앞으로 쓸 비밀번호를 정해 주세요. 아이디는 <code>${esc(v.username)}</code> 입니다.`;
    $("setForm").classList.remove("hide");
    $("pw1").focus();
  }

  $("setForm").addEventListener("submit", (e) => {
    e.preventDefault();
    if ($("pw1").value !== $("pw2").value) {
      Bass.updateAppAlert("diff", "비밀번호 두 칸이 서로 다릅니다.", "같은 비밀번호를 두 번 입력해 주세요.");
      return;
    }
    Bass.withLock($("btnSet"), async () => {
      const r = await Bass.api("rent4", "/reset/set", { method: "POST", body: { t: token, new: $("pw1").value } });
      Bass.setToken(r.token);
      location.replace(r.home);
    }, "저장 중...");
  });

  if (!token) {
    failed();
    Bass.updateAppAlert("error", "링크가 올바르지 않습니다.", "받은 링크 전체를 그대로 열어 주세요.");
  } else {
    load().catch((err) => { failed(); Bass.showError(err); });
  }
})();
</script>
</body>
</html>
