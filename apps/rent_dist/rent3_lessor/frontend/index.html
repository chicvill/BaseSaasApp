<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>🏢 임대인 자산·수납 관제 — Rent3 Lessor</title>
  <link rel="stylesheet" href="/shared/ui/base.css">
  <link rel="stylesheet" href="/shared/ui/rent3_mobile.css">
  <style>
    .app-shell { max-width: 960px; margin: 0 auto; padding: 16px 14px 70px; }
    .nav-pills { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 12px; }
    .kpi-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 10px; margin: 12px 0; }
    .kpi-box { padding: 14px; border-radius: 14px; background: var(--surface); border: 1px solid var(--border); }
    .kpi-val { font-size: 21px; font-weight: 800; margin-top: 4px; }
    .tabs { display: flex; gap: 6px; flex-wrap: wrap; margin: 14px 0; }
    .tab-btn.is-active { background: linear-gradient(120deg, var(--primary), var(--primary-2)); border-color: transparent; font-weight: 800; }
    .room-card { padding: 16px; border-radius: 16px; background: var(--surface); border: 1px solid var(--border); margin-bottom: 12px; }
    .field-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 10px; }
    .month-chip { display: inline-block; font-size: 11.5px; padding: 4px 8px; border-radius: 8px; margin: 2px; border: 1px solid var(--border); }
    .month-PAID { color: var(--ok); border-color: hsl(152 65% 50% / .4); }
    .month-UNPAID, .month-PARTIAL { color: var(--err); border-color: hsl(356 85% 62% / .5); font-weight: 700; }
    .month-EXEMPT_POSTPAID { color: var(--primary-2); border-color: hsl(196 95% 58% / .4); }
    .r3-lbl { display: block; font-size: 13px; font-weight: 700; margin: 2px 0 4px; }
    .r3-fld { display: grid; gap: 3px; font-size: 12.5px; }
    .r3-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
    .r3-msg { width: 100%; font-size: 13px; line-height: 1.5; }
    .rc-head { display: flex; justify-content: space-between; align-items: center; gap: 8px; margin-bottom: 8px; }
    .rc-title { font-size: 17px; }
    .rc-title span { font-size: 15px; margin-left: 4px; }
    .rc-unpaid { font-weight: 800; font-size: 14px; color: var(--ok); }
    .rc-unpaid.is-late { color: var(--err); font-size: 16px; }
    .rc-btns { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px; margin-bottom: 8px; }
    .rc-btns .bass-btn { padding-left: 4px; padding-right: 4px; white-space: nowrap; }
    .rc-warn { background: hsl(46 96% 56%) !important; color: #2b2300 !important; border-color: hsl(46 96% 40%) !important; font-weight: 800; }
    .rc-info { font-size: 13px; line-height: 1.7; }
    .r3-modal { position: fixed; inset: 0; z-index: 1000; background: rgba(0, 0, 0, .55); display: flex; align-items: flex-end; justify-content: center; }
    .r3-modal__box { width: 100%; max-width: 560px; max-height: 92vh; overflow-y: auto; background: #17172e; color: #eceaf7; border: 1px solid var(--border); border-radius: 16px 16px 0 0; padding: 14px 14px 22px; }
    @media (min-width: 640px) { .r3-modal { align-items: center; } .r3-modal__box { border-radius: 16px; } }
    .r3-modal__head { display: flex; justify-content: space-between; align-items: center; gap: 8px; margin-bottom: 10px; font-size: 15px; }
    .r3-modal__x { min-width: 40px; min-height: 40px; font-size: 18px; }
    .pr { display: grid; grid-template-columns: 44px minmax(0, 1.5fr) minmax(0, 1fr) minmax(0, 1fr); gap: 4px; align-items: center; padding: 3px 0; border-bottom: 1px solid var(--border); font-size: 12.5px; min-height: 40px; }
    .pr .bass-input { padding: 6px 4px; font-size: 12.5px; min-width: 0; width: 100%; }
    .pr--head { font-weight: 700; min-height: 0; border-bottom: 2px solid var(--border); }
    .pr--un, .pr--ok { grid-template-columns: 44px 1fr; }
    .pr--un .pr__un { color: var(--err); font-weight: 800; }
    .pr-list { max-height: 205px; overflow-y: auto; border-bottom: 1px solid var(--border); }
    .contract-photo-preview { max-width: 100%; max-height: 360px; border-radius: 12px; border: 1px solid var(--border); margin-top: 8px; display: block; background: #fff; }
  </style>
</head>
<body>
  <main class="app-shell">
    <div id="app-alert"></div>

        <header class="bass-card">
      <div class="bass-row" style="justify-content:space-between;">
        <div>
          <h1 style="font-size:21px;margin-bottom:4px;">🏢 임대인 · 월세 수납 현황</h1>
          <div id="bldgSubtitle" class="bass-muted" style="font-size:13px;">공동 JSON Data Pool 실시간 연동 중...</div>
        </div>
        <div class="bass-row">
          <select id="branchSelect" class="bass-select" style="width:auto;"></select>
          <span id="poolRevBadge" hidden></span>
          <button type="button" data-r3-burger>☰ 더보기</button>
        </div>
      </div>

      <div id="franchiseBanner"></div>
      <div id="kpiGrid" class="kpi-grid"></div>
    </header>

    <nav class="tabs" id="tabBar">
      <button class="bass-btn tab-btn is-active" data-tab="ledger" type="button">💰 월세 수납 현황</button>
      <button class="bass-btn tab-btn" data-tab="rooms" type="button">🏷️ 임대매물등록</button>
      <a class="bass-btn" href="/rent3_contract/" style="text-decoration:none;">🤝 직거래 계약</a>

      <aside class="r3-drawer" data-r3-drawer>
        <div class="r3-drawer__group">관리 도구</div>
        <button class="bass-btn tab-btn" data-tab="broker" type="button">📸 중개 계약서 사진 등록</button>
        <button class="bass-btn tab-btn" data-tab="tax" type="button">📊 운영비 · 세금 정리</button>
        <button class="bass-btn tab-btn" data-tab="ops" type="button">🔧 A/S · 채팅 · 퇴실정산</button>
        <div class="r3-drawer__group">그 밖의</div>
        <a href="manual.html">📘 이용 매뉴얼</a>
        <a href="/rent3/pool.html">🌐 Data Pool 관제</a>
        <a href="/rent3_tenant/">🔑 임차인 앱</a>
        <a href="/rent3_admin/">👑 관리인 앱</a>
      </aside>
    </nav>

    <section id="tabContent"></section>
  </main>

  <script src="/shared/ui/bass.js"></script>
  <script src="/shared/ui/rent3_session_guard.js"></script>
  <script src="/rent3/hamburger.js"></script>
  <script src="/rent3/session-bar.js"></script>
  <script src="app.js"></script>
<script src="/shared/ui/phone_fmt.js"></script>
</body>
</html>
