<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>🏢 임대인 자산·수납 관제 — Rent3 Lessor</title>
  <link rel="stylesheet" href="/shared/ui/base.css">
  <link rel="stylesheet" href="/shared/ui/rent3_mobile.css">
  <style>
    .app-shell { max-width: 960px; margin: 0 auto; padding: 16px 14px 70px; }
    .nav-pills { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 12px; }
    .kpi-strip { display: flex; flex-wrap: wrap; gap: 4px 14px; align-items: baseline; margin: 8px 0 2px; font-size: 14px; }
    .kpi-strip strong { font-size: 18px; }
    .kpi-box { padding: 14px; border-radius: 14px; background: var(--surface); border: 1px solid var(--border); }
    .kpi-val { font-size: 21px; font-weight: 800; margin-top: 4px; }
    .tabs { display: flex; gap: 6px; flex-wrap: wrap; margin: 14px 0; }
    .tab-btn.is-active { background: linear-gradient(120deg, var(--primary), var(--primary-2)); border-color: transparent; font-weight: 800; }
    .room-card { padding: 16px; border-radius: 16px; background: var(--surface); border: 1px solid var(--border); margin-bottom: 12px; }
    .field-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 10px; }
    .month-chip { display: inline-block; font-size: 11.5px; padding: 4px 8px; border-radius: 8px; margin: 2px; border: 1px solid var(--border); }
    .month-PAID { color: var(--ok); border-color: hsl(152 65% 50% / .4); }
    .month-UNPAID, .month-PARTIAL { color: var(--err); border-color: hsl(356 85% 62% / .5); font-weight: 700; }
    .month-EXEMPT_POSTPAID { color: var(--primary-2); border-color: hsl(196 95% 58% / .4); }
    .contract-photo-preview { max-width: 100%; max-height: 360px; border-radius: 12px; border: 1px solid var(--border); margin-top: 8px; display: block; background: #fff; }
  </style>
</head>
<body>
  <main class="app-shell">
    <div id="app-alert"></div>

        <header class="bass-card">
      <div class="bass-row" style="justify-content:space-between;">
        <div>
          <h1 id="bldgTitle" style="font-size:19px;margin-bottom:2px;">🏢 불러오는 중...</h1>
          <div id="bldgSubtitle" class="bass-muted" style="font-size:13px;"></div>
        </div>
        <div class="bass-row">
          <select id="branchSelect" class="bass-select" style="width:auto;" hidden></select>
          <span id="poolRevBadge" hidden></span>
          <button type="button" data-r3-burger>☰ 더보기</button>
        </div>
      </div>

      <div id="franchiseBanner"></div>
      <div id="kpiGrid" class="kpi-strip"></div>
    </header>

    <!-- 메뉴 항목은 app.js 의 LESSOR_MENU 가 r3_shell.js 로 채운다. 첫 화면은 수납 현황 하나뿐. -->
    <nav id="tabBar"><aside class="r3-drawer" data-r3-drawer></aside></nav>

    <div id="backBar" class="bass-row" style="gap:8px;margin:10px 0;" hidden>
      <button id="btnBackLedger" class="bass-btn bass-btn--sm" type="button">← 수납 현황</button>
      <strong id="backTitle" style="font-size:15px;"></strong>
    </div>


    <section id="tabContent"></section>
  </main>

  <script src="/shared/ui/bass.js"></script>
  <script src="/shared/ui/r3_modal.js"></script>
  <script src="/shared/ui/r3_shell.js"></script>
  <script src="/shared/ui/rent3_session_guard.js"></script>
  <script src="/rent3/hamburger.js"></script>
  <script src="/rent3/session-bar.js"></script>
  <script src="app.js"></script>
<script src="/shared/ui/phone_fmt.js"></script>
</body>
</html>
