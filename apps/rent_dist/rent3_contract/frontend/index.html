<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#2563eb">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Rent3">
  <link rel="manifest" href="/rent3/manifest.json">
  <link rel="apple-touch-icon" href="/rent3_tenant/icons/apple-touch-icon.png">
  <title>🤝 스마트 계약 — Rent3</title>
  <link rel="stylesheet" href="/shared/ui/base.css">
  <link rel="stylesheet" href="/shared/ui/rent3_mobile.css">
  <style>
    [hidden] { display: none !important; }
    .app-shell { max-width: 640px; margin: 0 auto; padding: 14px 14px 64px; }

    /* 상단 바 */
    .topbar { display: flex; justify-content: space-between; align-items: center; gap: 8px; margin-bottom: 12px; flex-wrap: wrap; }
    .who-badge { font-size: 12.5px; }

    /* 홈: 호실 현황 */
    .room-row { display: flex; justify-content: space-between; align-items: center; gap: 10px; padding: 12px 13px; border-radius: 12px;
      background: hsl(232 30% 12% / .65); border: 1px solid var(--border); margin-bottom: 8px; }
    .room-row__main { min-width: 0; }
    .room-row__title { font-weight: 800; font-size: 15px; }
    .room-row__meta { font-size: 12px; margin-top: 3px; }
    .room-row .bass-btn { flex: none; white-space: nowrap; }
    .pay-row { display: flex; justify-content: space-between; padding: 7px 4px; border-bottom: 1px solid var(--border); font-size: 13px; }
    .big-cta { width: 100%; padding: 16px; font-size: 16px; font-weight: 800; }
    .call-banner { padding: 14px 16px; border-radius: 14px; border: 1px solid hsl(38 92% 55% / .55); background: hsl(38 90% 50% / .14); margin-bottom: 14px; }

    /* 계약 화면: 진행 차트 */
    .cv-head { position: sticky; top: 0; z-index: 30; margin: -14px -14px 0; padding: 10px 14px 10px;
      background: var(--bg, #ffffff); border-bottom: 1px solid var(--border); }
    .cv-head__row { display: flex; justify-content: space-between; align-items: center; gap: 6px; flex-wrap: nowrap; }
    .cv-head__actions { display: flex; align-items: center; gap: 6px; flex-wrap: nowrap; }
    .cv-head__info { margin-top: 6px; display: flex; align-items: baseline; gap: 6px 10px; flex-wrap: wrap; }
    #cvHead .r3-bell, #bellHomeSlot .r3-bell { width: 38px; height: 38px; min-height: 38px; font-size: 18px; margin-left: 0 !important; }
    .cv-title { font-weight: 800; font-size: 16px; line-height: 1.3; white-space: nowrap; }
    .cv-head__info .bass-muted { font-size: 12.5px; line-height: 1.4; word-break: keep-all; }
    .stepper { display: grid; grid-template-columns: repeat(5, 1fr); gap: 4px; margin-top: 8px; }
    .step-pill { text-align: center; padding: 7px 2px; border-radius: 10px; font-size: 12px; background: var(--surface);
      border: 1px solid var(--border); pointer-events: none; white-space: nowrap; }
    .step-pill.is-done { border-color: var(--ok); color: var(--ok); }
    .step-pill.is-now { background: hsl(258 90% 60% / .25); border-color: var(--primary); font-weight: 800; }

    /* 단계 모달: 채팅방 위에서 등기부등본·표준계약서를 좌우상하 스크롤로 보고 승인하는 모달 */
    .cm-backdrop { position: fixed; inset: 0; z-index: 50; background: rgba(15, 23, 42, .56);
      display: flex; justify-content: center; align-items: center; padding: 10px; }
    .ws-action-card { background: #ffffff; border: 1px solid #dbeafe; border-radius: 14px; padding: 10px 12px; margin: 8px 0 8px;
      box-shadow: 0 3px 10px rgba(15, 23, 42, .05); }
    .ws-action-card__head { display: flex; justify-content: space-between; align-items: center; gap: 8px; flex-wrap: wrap; }
    .ws-action-card__btns { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 7px; }
    .cm-bundle { background: #ffffff; border: 1.5px solid #bfdbfe; border-radius: 16px; padding: 12px 14px; margin: 6px 0;
      box-shadow: 0 3px 12px rgba(37, 99, 235, .08); }
    .cm-bundle__grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 6px 10px; margin: 8px 0; font-size: 13px; }
    .cm-bundle__row { display: flex; justify-content: space-between; gap: 6px; padding: 4px 8px; background: #f8fafc; border-radius: 8px; }
    .step-pill { cursor: pointer; pointer-events: auto; }
    .cm-card { width: 100%; max-width: min(880px, 96vw); max-height: 92vh; display: flex; flex-direction: column; overflow: hidden;
      background: #ffffff; border: 1px solid #e2e8f0; color: #1e293b;
      border-radius: 20px; padding: 0; box-shadow: 0 18px 42px rgba(15, 23, 42, .22);
      transition: opacity .2s ease-in, transform .2s ease-in; }
    .cm-modal-head { flex: none; display: flex; justify-content: space-between; align-items: center; gap: 8px;
      padding: 13px 16px; border-bottom: 1px solid #e2e8f0; background: #ffffff; }
    .cm-scroll-hint { flex: none; padding: 7px 16px; background: #eff6ff; border-bottom: 1px solid #dbeafe;
      color: #1e40af; font-size: 12.5px; font-weight: 700; display: flex; align-items: center; gap: 6px; }
    .cm-scroll-viewport { flex: 1 1 auto; min-height: 0; overflow: auto; -webkit-overflow-scrolling: touch;
      overscroll-behavior: contain; padding: 14px 16px 22px; }
    /* 4방향(좌우·상하) 스크롤 문서 시트 (등기부등본 대조표 · 주택임대차 표준계약서 전문) */
    .cm-doc-scroll-box { width: 100%; max-height: 48vh; overflow: auto; -webkit-overflow-scrolling: touch;
      overscroll-behavior: contain; border: 1.5px solid #cbd5e1; border-radius: 12px; background: #f8fafc;
      padding: 10px; margin: 10px 0 14px; }
    .cm-std-sheet { min-width: 660px; background: #ffffff; color: #0f172a; border: 1px solid #94a3b8;
      border-radius: 8px; padding: 16px 18px; line-height: 1.6; font-size: 13px; }
    .cm-std-sheet__head { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px;
      border-bottom: 2px solid #0f172a; padding-bottom: 10px; margin-bottom: 12px; }
    .cm-std-sheet__title { font-size: 16px; font-weight: 900; color: #0f172a; }
    .cm-std-sheet__sub { font-size: 12.5px; color: #475569; margin-top: 2px; }
    .cm-std-table { width: 100%; border-collapse: collapse; margin: 8px 0; font-size: 13px; }
    .cm-std-table th, .cm-std-table td { border: 1px solid #64748b; padding: 7px 9px; text-align: left; vertical-align: top; }
    .cm-std-table th { background: #f1f5f9; width: 18%; white-space: nowrap; font-weight: 800; color: #1e293b; }
    .cm-std-sheet__foot { margin-top: 12px; padding-top: 10px; border-top: 1px dashed #94a3b8; text-align: center;
      font-size: 13px; line-height: 1.75; }
    /* 채팅창 내 당사자 헤더 & 앱 개입 스마트 계약 카드 */
    .cg-party-header { display: flex; justify-content: space-between; align-items: center; gap: 8px; flex-wrap: wrap;
      padding: 10px 14px; border-radius: 14px; background: #ffffff; border: 1.5px solid #cbd5e1; margin-bottom: 8px; }
    .cg-party-header__title { font-weight: 900; font-size: 15px; color: #0f172a; display: flex; align-items: center; gap: 6px; }
    .cg-party-header__names { display: flex; gap: 12px; flex-wrap: wrap; font-size: 13px; color: #1e293b; }
    .cg-chat-stream { max-height: 60vh; min-height: 320px; overflow-y: auto; padding: 10px 10px 14px;
      border-radius: 16px; border: 1px solid #cbd5e1; background: #f1f5f9; }
    .cg-card { background: #ffffff; border: 1.5px solid #cbd5e1; border-left: 5px solid #64748b;
      border-radius: 14px; padding: 12px 13px; margin: 8px 0; color: #0f172a;
      box-shadow: 0 2px 8px rgba(15, 23, 42, .05); }
    .cg-card--active { border-color: #93c5fd; border-left-color: #2563eb; box-shadow: 0 4px 14px rgba(37, 99, 235, .12); }
    .cg-card--done { border-color: #86efac; border-left-color: #16a34a; background: #f0fdf4; }
    .cg-card__top { display: flex; justify-content: space-between; align-items: center; gap: 6px; flex-wrap: wrap; margin-bottom: 6px; }
    .cg-card__tag { font-size: 12px; font-weight: 800; color: #1d4ed8; background: #dbeafe; padding: 3px 8px; border-radius: 999px; }
    .cg-card--done .cg-card__tag { color: #15803d; background: #dcfce7; }
    .cg-card__msg { font-size: 13.5px; line-height: 1.6; color: #0f172a; word-break: keep-all; }
    .cg-check { display: flex; justify-content: space-between; align-items: center; gap: 10px;
      padding: 9px 11px; border-radius: 10px; border: 1px solid #e2e8f0; background: #f8fafc;
      margin-top: 6px; font-size: 13px; line-height: 1.45; }
    .cg-check.is-actionable { cursor: pointer; border-color: #93c5fd; background: #eff6ff; }
    .cg-check.is-checked { border-color: #86efac; background: #ecfdf5; color: #065f46; }
    .cg-check__label { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
    .cg-check__hint { font-size: 12px; color: #64748b; }
    .cg-check input[type="checkbox"] { width: 20px; height: 20px; accent-color: #16a34a; flex: none; cursor: pointer; }
    .cg-link-row { display: flex; gap: 6px; flex-wrap: wrap; margin: 8px 0 6px; }
    .cg-link-btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px;
      padding: 9px 12px; border-radius: 11px; border: 1.5px solid #2563eb; background: #eff6ff;
      color: #1d4ed8; font-weight: 800; font-size: 13px; cursor: pointer; text-decoration: none;
      line-height: 1.35; }
    .cg-link-btn:hover { background: #dbeafe; }
    .cg-link-btn--primary { background: #2563eb; color: #ffffff; border-color: #1d4ed8; }
    .cg-link-btn--primary:hover { background: #1d4ed8; }
    .cg-reg-list { margin: 8px 0 4px; padding: 8px 10px; border-radius: 10px; background: #f8fafc;
      border: 1px solid #e2e8f0; display: grid; gap: 5px; font-size: 13px; }
    .cg-reg-item { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
    .cg-memo-chip { margin: 7px 0; padding: 8px 10px; border-radius: 10px; background: #fffbeb;
      border: 1px solid #fde68a; font-size: 12.5px; line-height: 1.5; color: #78350f; }
    .cg-sign-paper { margin-top: 6px; padding: 12px 14px; border-radius: 12px; background: #ffffff;
      border: 1.5px solid #cbd5e1; }
    .cg-sign-paper__title { font-weight: 900; font-size: 14.5px; text-align: center; color: #0f172a; }
    .cg-sign-paper__date { font-size: 13px; text-align: center; color: #475569; margin: 3px 0 10px; }
    .cg-sign-row { display: flex; justify-content: space-between; align-items: center; gap: 10px;
      padding: 8px 10px; border-top: 1px solid #e2e8f0; font-size: 13.5px; }
    .cg-sign-row__who { display: inline-flex; align-items: center; gap: 8px; }
    .cg-sign-row__sig { display: inline-flex; align-items: center; gap: 6px; flex-wrap: wrap; justify-content: flex-end; }
    .cg-pause-banner { background: #fffbeb; border: 1.5px solid #f59e0b; border-left: 5px solid #d97706;
      border-radius: 14px; padding: 12px 14px; margin: 8px 0; color: #78350f; }
    .cg-reg-opt-box { display: flex; justify-content: space-between; align-items: center; gap: 10px;
      padding: 9px 11px; border-radius: 10px; border: 1.5px solid #bfdbfe; background: #eff6ff;
      margin: 6px 0 8px; font-size: 13px; color: #1e3a8a; }
    .cg-reg-opt-box input[type="checkbox"] { width: 20px; height: 20px; accent-color: #2563eb; flex: none; cursor: pointer; }
    .cg-ocr-box { margin: 8px 0; padding: 10px 12px; border-radius: 11px; border: 1.5px dashed #60a5fa;
      background: #f8fafc; font-size: 12.5px; line-height: 1.55; }
    .cg-ai-summary { margin-top: 8px; padding: 9px 11px; border-radius: 10px; background: #ecfdf5;
      border: 1px solid #86efac; color: #065f46; font-size: 12.5px; line-height: 1.6; }
    .cg-ai-bar { display: flex; gap: 6px; flex-wrap: wrap; margin: 6px 0; }
    .cg-flow-guide { margin-bottom: 14px; padding: 10px 12px; border-radius: 14px; border: 1px solid #bfdbfe;
      background: #f8fafc; font-size: 12.5px; line-height: 1.65; color: #1e293b; }
    .cg-flow-steps { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 6px; margin-top: 8px; }
    .cg-flow-chip { padding: 7px 9px; border-radius: 10px; background: #ffffff; border: 1px solid #dbeafe; font-size: 12px; }
    .cg-bank-grid { display: grid; gap: 8px; margin-top: 8px; }
    .cg-bank-box { padding: 10px 12px; border-radius: 11px; border: 1px solid #cbd5e1; background: #f8fafc; font-size: 13px; line-height: 1.55; }
    .cg-bank-box.is-ok { border-color: #86efac; background: #ecfdf5; }
    .cg-bank-box.is-mine { border-color: #93c5fd; background: #eff6ff; }
    .cg-code-badge { display: inline-flex; align-items: center; gap: 6px; padding: 5px 12px; border-radius: 10px;
      background: #1d4ed8; color: #ffffff; font-size: 18px; font-weight: 900; letter-spacing: 3px; font-family: monospace; }
    .cg-inline-row { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; margin-top: 6px; }
    .cg-id-links { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 7px; font-size: 12px; color: #475569; align-items: center; }
    /* 기본 상태가 '보임'이다. 모션을 끈 환경(prefers-reduced-motion)에서도 창이 사라지지 않는다. */
    .cm-card.is-open { animation: cm-in .26s ease-out; }
    .cm-card.is-closing { opacity: 0; transform: translateY(-14px) scale(.98); }
    @keyframes cm-in { from { opacity: 0; transform: translateY(18px) scale(.98); } }

    /* 일반 다이얼로그(호출 폼 등) */
    .dlg-backdrop { position: fixed; inset: 0; z-index: 60; background: rgba(15, 23, 42, .48); display: flex; align-items: center;
      justify-content: center; padding: 14px; overflow-y: auto; }
    .dlg { width: 100%; max-width: 460px; background: #ffffff; border: 1px solid #e2e8f0; color: #1e293b;
      border-radius: 20px; padding: 18px 16px; box-shadow: 0 18px 42px rgba(15, 23, 42, .18); }

    /* 기존 단계 화면 요소 */
    .field-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 10px; }
    .check-row { display: flex; justify-content: space-between; align-items: center; gap: 10px; padding: 11px 13px; border-radius: 12px; background: hsl(232 30% 12% / .65); border: 1px solid var(--border); margin-bottom: 8px; }
    .id-verify-grid { display: grid; grid-template-columns: 1fr; gap: 10px; margin: 12px 0; }
    .id-card-box { padding: 14px; border-radius: 12px; background: hsl(232 30% 12% / .72); border: 1px solid var(--border); }
    .id-card-box.is-verified { border-color: var(--ok); box-shadow: inset 0 0 0 1px hsl(150 75% 45% / .25); }
    .gate-list { display: grid; gap: 6px; margin: 10px 0 14px; }
    .gate-item { display: flex; justify-content: space-between; align-items: center; padding: 8px 11px; border-radius: 10px; font-size: 12.5px; background: hsl(232 30% 12% / .6); border: 1px solid var(--border); }
    .sig-pad { width: 100%; height: 110px; background: #fff; border-radius: 12px; border: 2px solid var(--border-strong); touch-action: none; cursor: crosshair; }
    .check-row, .gate-item { word-break: keep-all; }
    .wait-row { display: flex; justify-content: space-between; align-items: center; padding: 11px 13px; border-radius: 12px;
      border: 1px solid var(--border); margin-top: 8px; background: hsl(232 30% 12% / .55); }
    .wait-dots::after { content: ""; animation: dots 1.4s steps(4, end) infinite; }
    @keyframes dots { 0% { content: ""; } 25% { content: "."; } 50% { content: ".."; } 75% { content: "..."; } }
    .contract-paper { background: #fff; color: #111; padding: 22px; border-radius: 14px; line-height: 1.65; margin-top: 16px; }
    .contract-paper h2, .contract-paper h3 { color: #000; }
    .contract-paper table { width: 100%; border-collapse: collapse; margin: 10px 0; font-size: 13px; }
    .contract-paper th, .contract-paper td { border: 1px solid #444; padding: 7px 9px; text-align: left; }
    .contract-paper th { background: #f1f5f9; width: 24%; }
    /* 좁은 화면(스마트폰): 4열 표를 항목 위/값 아래로 쌓아 글자가 한 글자씩 꺾이지 않게 한다 */
    @media screen and (max-width: 640px) {
      .contract-paper { padding: 16px 14px; }
      .contract-paper table, .contract-paper tbody, .contract-paper tr, .contract-paper th, .contract-paper td { display: block; width: 100%; }
      .contract-paper tr { margin-bottom: 8px; border: 1px solid #444; }
      .contract-paper th, .contract-paper td { border: 0; border-bottom: 1px solid #ccc; }
      .contract-paper th { width: 100%; padding: 5px 9px; font-size: 12px; }
    }
    /* 인쇄(행정복지센터 제출용): 계약서만 A4 한 장 규격으로 */
    @page { size: A4; margin: 14mm; }
    @media print {
      html, body { background: #fff !important; color: #000 !important; }
      .no-print, #app-alert, #homeView, #dlgHost { display: none !important; }
      .app-shell { max-width: none; padding: 0; margin: 0; }
      #contractView, #sealedContractView { display: block !important; }
      .contract-paper { box-shadow: none; padding: 0; margin: 0; border-radius: 0; font-size: 12pt; }
      .contract-paper table { page-break-inside: avoid; }
      .contract-paper th { width: 24%; }
    }
  </style>
  <link rel="stylesheet" href="/shared/ui/r3_readable.css">

<body>
  <main class="app-shell">
    <div id="app-alert"></div>

    <!-- ───────── 홈: 내 역할에 맞는 현황 + 임대계약 버튼 ───────── -->
    <section id="homeView">
      <div class="topbar no-print">
        <a class="bass-btn bass-btn--sm" href="/rent3/?home=1">🏡 포털</a>
        <div class="bass-row">
          <span id="bellHomeSlot" style="display:inline-flex;"></span>
          <span id="whoBadge" class="bass-badge bass-badge--info who-badge"></span>
          <a class="bass-btn bass-btn--sm" href="/rent3/?logout=1">로그아웃</a>
        </div>
      </div>
      <div id="homeBody"></div>
    </section>

    <!-- ───────── 계약 화면: 진행 차트 + 단계별 모달 ───────── -->
    <section id="contractView" hidden>
      <header class="cv-head no-print" id="cvHead">
        <div class="cv-head__row">
          <button id="btnBackHome" class="bass-btn bass-btn--sm" type="button">← 홈</button>
          <div class="cv-head__actions">
            <span id="callStateBadge" class="bass-badge bass-badge--ok">연결됨</span>
            <button id="btnPauseContract" class="bass-btn bass-btn--sm" type="button" hidden>⏸️ 보류</button>
            <button id="btnCancelContract" class="bass-btn bass-btn--sm" type="button" hidden>계약 취소</button>
            <span id="bellCvSlot" style="display:inline-flex;"></span>
          </div>
        </div>
        <div class="cv-head__info">
          <div id="wsTitle" class="cv-title"></div>
          <div id="wsMeta" class="bass-muted"></div>
        </div>
        <div class="stepper" id="stepperBar">
          <div class="step-pill" data-step="1">① 본인확인</div>
          <div class="step-pill" data-step="2">② 옵션점검</div>
          <div class="step-pill" data-step="3">③ 조건</div>
          <div class="step-pill" data-step="4">④ 서명</div>
          <div class="step-pill" data-step="5">⑤ 체결</div>
        </div>
        <div id="turnLine" class="turn-line" aria-live="polite"></div>
      </header>

      <section id="chatWorkspace" class="no-print" style="margin-top:8px;">
        <div id="wsPartyHeader" class="cg-party-header"></div>
        <div id="cmCall" style="margin-bottom:6px;"></div>
        <div id="wsActionBar" class="ws-action-card"></div>
        <div id="wsChatList" class="cm-list cg-chat-stream"></div>
        <div id="wsChatNote" class="bass-muted" style="font-size:12px;margin:5px 0;"></div>
        <div id="wsChatComposer">
          <div class="r3-chat-compose">
            <textarea id="wsChatMsg" class="bass-input" rows="2" placeholder="상대방에게 보낼 채팅을 입력하세요"></textarea>
            <button id="wsChatSend" type="button" class="bass-btn bass-btn--sm bass-btn--primary">보내기</button>
          </div>
          <div class="cg-ai-bar">
            <button type="button" id="wsAiExplain" class="bass-btn bass-btn--sm">🤖 AI 쉬운 계약 요약</button>
            <button type="button" id="wsAiClause" class="bass-btn bass-btn--sm">✨ AI 특약 다듬기</button>
            <button type="button" id="wsAiOcr" class="bass-btn bass-btn--sm">📷 메모·계약서 사진 OCR</button>
          </div>
