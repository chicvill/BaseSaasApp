<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>🤝 임대계약 — Rent3</title>
  <link rel="stylesheet" href="/shared/ui/base.css">
  <style>
    [hidden] { display: none !important; }
    .app-shell { max-width: 640px; margin: 0 auto; padding: 14px 14px 64px; }

    /* 상단 바 */
    .topbar { display: flex; justify-content: space-between; align-items: center; gap: 8px; margin-bottom: 12px; flex-wrap: wrap; }
    .who-badge { font-size: 12.5px; }

    /* 홈: 호실 현황 */
    .room-row { display: flex; justify-content: space-between; align-items: center; gap: 10px; padding: 12px 13px; border-radius: 12px;
      background: hsl(232 30% 12% / .65); border: 1px solid var(--border); margin-bottom: 8px; }
    .room-row__main { min-width: 0; }
    .room-row__title { font-weight: 800; font-size: 15px; }
    .room-row__meta { font-size: 12px; margin-top: 3px; }
    .room-row .bass-btn { flex: none; white-space: nowrap; }
    .pay-row { display: flex; justify-content: space-between; padding: 7px 4px; border-bottom: 1px solid var(--border); font-size: 13px; }
    .big-cta { width: 100%; padding: 16px; font-size: 16px; font-weight: 800; }
    .call-banner { padding: 14px 16px; border-radius: 14px; border: 1px solid hsl(38 92% 55% / .55); background: hsl(38 90% 50% / .14); margin-bottom: 14px; }

    /* 계약 화면: 진행 차트 */
    .cv-head { position: sticky; top: 0; z-index: 30; margin: -14px -14px 0; padding: 12px 14px 10px;
      background: var(--bg, #0b0f1a); border-bottom: 1px solid var(--border); }
    .cv-head__row { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
    .cv-title { font-weight: 800; font-size: 15px; line-height: 1.3; }
    .stepper { display: grid; grid-template-columns: repeat(5, 1fr); gap: 5px; margin-top: 10px; }
    .step-pill { text-align: center; padding: 8px 2px; border-radius: 10px; font-size: 11.5px; background: var(--surface);
      border: 1px solid var(--border); pointer-events: none; }
    .step-pill.is-done { border-color: var(--ok); color: var(--ok); }
    .step-pill.is-now { background: hsl(258 90% 60% / .25); border-color: var(--primary); font-weight: 800; }

    /* 단계 모달: 진행 차트 바로 아래에 열린다 */
    .cm-backdrop { position: fixed; left: 0; right: 0; bottom: 0; top: 150px; z-index: 20; background: rgba(5, 8, 20, .62);
      display: flex; justify-content: center; align-items: flex-start; padding: 12px 10px 10px; overflow-y: auto; }
    .cm-card { width: 100%; max-width: 620px; background: hsl(232 32% 13% / .98); border: 1px solid var(--border-strong, var(--border));
      border-radius: 18px; padding: 18px 16px 20px; box-shadow: 0 18px 50px rgba(0, 0, 0, .45);
      transition: opacity .2s ease-in, transform .2s ease-in; }
    /* 기본 상태가 '보임'이다. 모션을 끈 환경(prefers-reduced-motion)에서도 창이 사라지지 않는다. */
    .cm-card.is-open { animation: cm-in .26s ease-out; }
    .cm-card.is-closing { opacity: 0; transform: translateY(-14px) scale(.98); }
    @keyframes cm-in { from { opacity: 0; transform: translateY(18px) scale(.98); } }

    /* 일반 다이얼로그(호출 폼 등) */
    .dlg-backdrop { position: fixed; inset: 0; z-index: 60; background: rgba(5, 8, 20, .7); display: flex; align-items: center;
      justify-content: center; padding: 14px; overflow-y: auto; }
    .dlg { width: 100%; max-width: 460px; background: hsl(232 32% 13% / .98); border: 1px solid var(--border-strong, var(--border));
      border-radius: 18px; padding: 18px 16px; }

    /* 기존 단계 화면 요소 */
    .field-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 10px; }
    .check-row { display: flex; justify-content: space-between; align-items: center; gap: 10px; padding: 11px 13px; border-radius: 12px; background: hsl(232 30% 12% / .65); border: 1px solid var(--border); margin-bottom: 8px; }
    .id-verify-grid { display: grid; grid-template-columns: 1fr; gap: 10px; margin: 12px 0; }
    .id-card-box { padding: 14px; border-radius: 12px; background: hsl(232 30% 12% / .72); border: 1px solid var(--border); }
    .id-card-box.is-verified { border-color: var(--ok); box-shadow: inset 0 0 0 1px hsl(150 75% 45% / .25); }
    .gate-list { display: grid; gap: 6px; margin: 10px 0 14px; }
    .gate-item { display: flex; justify-content: space-between; align-items: center; padding: 8px 11px; border-radius: 10px; font-size: 12.5px; background: hsl(232 30% 12% / .6); border: 1px solid var(--border); }
    .sig-pad { width: 100%; height: 110px; background: #fff; border-radius: 12px; border: 2px solid var(--border-strong); touch-action: none; cursor: crosshair; }
    .check-row, .gate-item { word-break: keep-all; }
    .wait-row { display: flex; justify-content: space-between; align-items: center; padding: 11px 13px; border-radius: 12px;
      border: 1px solid var(--border); margin-top: 8px; background: hsl(232 30% 12% / .55); }
    .wait-dots::after { content: ""; animation: dots 1.4s steps(4, end) infinite; }
    @keyframes dots { 0% { content: ""; } 25% { content: "."; } 50% { content: ".."; } 75% { content: "..."; } }
    .contract-paper { background: #fff; color: #111; padding: 22px; border-radius: 14px; line-height: 1.65; margin-top: 16px; }
    .contract-paper h2, .contract-paper h3 { color: #000; }
    .contract-paper table { width: 100%; border-collapse: collapse; margin: 10px 0; font-size: 13px; }
    .contract-paper th, .contract-paper td { border: 1px solid #444; padding: 7px 9px; text-align: left; }
    .contract-paper th { background: #f1f5f9; width: 24%; }
    /* 좁은 화면(스마트폰): 4열 표를 항목 위/값 아래로 쌓아 글자가 한 글자씩 꺾이지 않게 한다 */
    @media screen and (max-width: 640px) {
      .contract-paper { padding: 16px 14px; }
      .contract-paper table, .contract-paper tbody, .contract-paper tr, .contract-paper th, .contract-paper td { display: block; width: 100%; }
      .contract-paper tr { margin-bottom: 8px; border: 1px solid #444; }
      .contract-paper th, .contract-paper td { border: 0; border-bottom: 1px solid #ccc; }
      .contract-paper th { width: 100%; padding: 5px 9px; font-size: 12px; }
    }
    /* 인쇄(행정복지센터 제출용): 계약서만 A4 한 장 규격으로 */
    @page { size: A4; margin: 14mm; }
    @media print {
      html, body { background: #fff !important; color: #000 !important; }
      .no-print, #app-alert, #homeView, #dlgHost { display: none !important; }
      .app-shell { max-width: none; padding: 0; margin: 0; }
      #contractView, #sealedContractView { display: block !important; }
      .contract-paper { box-shadow: none; padding: 0; margin: 0; border-radius: 0; font-size: 12pt; }
      .contract-paper table { page-break-inside: avoid; }
      .contract-paper th { width: 24%; }
    }
  </style>
</head>
<body>
  <main class="app-shell">
    <div id="app-alert"></div>

    <!-- ───────── 홈: 내 역할에 맞는 현황 + 임대계약 버튼 ───────── -->
    <section id="homeView">
      <div class="topbar no-print">
        <a class="bass-btn bass-btn--sm" href="/rent3/">🏡 포털</a>
        <div class="bass-row">
          <span id="whoBadge" class="bass-badge bass-badge--info who-badge"></span>
          <a class="bass-btn bass-btn--sm" href="/rent3/?logout=1">로그아웃</a>
        </div>
      </div>
      <div id="homeBody"></div>
    </section>

    <!-- ───────── 계약 화면: 진행 차트 + 단계별 모달 ───────── -->
    <section id="contractView" hidden>
      <header class="cv-head no-print" id="cvHead">
        <div class="cv-head__row">
          <button id="btnBackHome" class="bass-btn bass-btn--sm" type="button">← 홈</button>
          <div style="text-align:center;flex:1;min-width:0;">
            <div id="wsTitle" class="cv-title"></div>
            <div id="wsMeta" class="bass-muted" style="font-size:11.5px;"></div>
          </div>
          <span id="callStateBadge" class="bass-badge bass-badge--ok">연결됨</span>
        </div>
        <div class="stepper" id="stepperBar">
          <div class="step-pill" data-step="1">① 본인확인</div>
          <div class="step-pill" data-step="2">② 옵션점검</div>
          <div class="step-pill" data-step="3">③ 조건</div>
          <div class="step-pill" data-step="4">④ 서명</div>
          <div class="step-pill" data-step="5">⑤ 체결</div>
        </div>
      </header>

      <div id="stepModal" class="cm-backdrop no-print" hidden>
        <div id="stepCard" class="cm-card"><div id="stepPanel"></div></div>
      </div>

      <section id="sealedContractView" style="display:none;"></section>
    </section>
  </main>

  <div id="dlgHost"></div>

  <script src="/shared/ui/bass.js"></script>
  <script src="qrcode.min.js"></script>
  <script src="app.js"></script>
</body>
</html>
