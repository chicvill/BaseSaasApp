<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>👑 플랫폼 총괄 관리인 — Rent3 Admin</title>
  <link rel="stylesheet" href="/shared/ui/base.css">
  <link rel="stylesheet" href="/shared/ui/rent3_mobile.css">
  <style>
    .app-shell { max-width: 1020px; margin: 0 auto; padding: 16px 14px 70px; }
    .nav-pills { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 12px; }
    .kpi-strip { display: flex; flex-wrap: wrap; gap: 4px 14px; align-items: baseline; margin: 8px 0 2px; font-size: 14px; }
    .kpi-box { padding: 14px; border-radius: 14px; background: var(--surface); border: 1px solid var(--border); }
    .kpi-val { font-size: 20px; font-weight: 800; margin-top: 4px; }
    .tabs { display: flex; gap: 6px; flex-wrap: wrap; margin: 14px 0; }
    .tab-btn.is-active { background: linear-gradient(120deg, var(--primary), var(--primary-2)); border-color: transparent; font-weight: 800; }
    .item-card { padding: 14px; border-radius: 14px; background: var(--surface); border: 1px solid var(--border); margin-bottom: 10px; }
    .field-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 10px; }
    pre.json-view { background: hsl(232 42% 6%); border: 1px solid var(--border-strong); border-radius: 12px; padding: 14px; font-size: 12px; max-height: 440px; overflow: auto; color: #cbd5e1; }
  </style>
</head>
<body>
  <main class="app-shell">
    <div id="app-alert"></div>

        <header class="bass-card">
      <div class="bass-row" style="justify-content:space-between;">
        <div>
          <h1 style="font-size:21px;margin-bottom:4px;">👑 관리인 · 가맹비 수납</h1>
          <div class="bass-muted" style="font-size:13px;">임대인 가맹 현황과 월 가맹비 납부를 확인합니다.</div>
        </div>
        <span id="poolBadge" hidden></span>
        <button type="button" data-r3-burger>☰ 더보기</button>
      </div>
      <div id="kpiGrid" class="kpi-strip"></div>
    </header>

    <nav class="tabs" id="tabBar">
      <button class="bass-btn tab-btn is-active" data-tab="support" type="button">🎯 원격 지원 · 대리 접속</button>
      <button class="bass-btn tab-btn" data-tab="lessors" type="button">🏢 임대인 가맹 · 월 가맹비</button>

      <aside class="r3-drawer" data-r3-drawer>
        <div class="r3-drawer__group">관제 도구</div>
        <button class="bass-btn tab-btn" data-tab="portfolio" type="button">📊 전 지점 건물 현황</button>
        <button class="bass-btn tab-btn" data-tab="pool" type="button">📂 Data Pool 탐색기</button>
        <div class="r3-drawer__group">그 밖의</div>
        <a href="manual.html">📘 이용 매뉴얼</a>
        <a href="/rent3/pool.html">🌐 Data Pool 관제</a>
        <span class="bass-muted" style="font-size:12px;padding:4px 8px;">임대인·임차인 화면은 <strong>원격 지원</strong>에서 들어갑니다.</span>
      </aside>
    </nav>

    <section id="tabContent"></section>
  </main>

  <script src="/shared/ui/bass.js"></script>
  <script src="/shared/ui/rent3_session_guard.js"></script>
  <script src="/rent3/hamburger.js"></script>
  <script src="/rent3/session-bar.js"></script>
  <script src="app.js"></script>
<script src="/shared/ui/phone_fmt.js"></script>
</body>
</html>
