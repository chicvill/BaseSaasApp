<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Rent5 로그인</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
<main class="wrap narrow">
  <header class="top">
    <a class="brand" href="./">🏠 Rent5</a>
  </header>
  <div id="alert"></div>

  <form class="card stack" id="loginForm">
    <h1>로그인</h1>
    <div><label for="username">아이디</label>
      <input id="username" autocomplete="username" autocapitalize="none" required></div>
    <div><label for="password">비밀번호</label>
      <input id="password" type="password" autocomplete="current-password" required></div>
    <button class="btn primary" id="btnLogin" type="submit">로그인</button>
    <p class="small muted center">계정이 없으신가요? <a id="signupLink" href="signup.html">회원가입</a></p>
  </form>
  <p class="small muted center">비밀번호를 잊으셨다면 운영자에게 초기화를 요청하세요.</p>
</main>
<script src="app.js"></script>
<script src="auth.js"></script>
</body>
</html>
