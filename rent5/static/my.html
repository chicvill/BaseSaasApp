<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data:; style-src 'self'; script-src 'self'">
  <title>Rent5 내 화면</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
<main class="wrap">
  <header class="top">
    <a class="brand" href="./">🏠 Rent5</a>
    <nav class="nav" id="nav"></nav>
  </header>
  <div id="alert"></div>

  <section class="card stack">
    <h2>내 계약</h2>
    <div id="contracts" class="stack"><span class="muted">불러오는 중...</span></div>
  </section>

  <section class="card stack">
    <div class="row between"><h2>내 매물 (임대인)</h2></div>
    <div id="myListings" class="stack"><span class="muted">불러오는 중...</span></div>
    <details>
      <summary class="btn sm">➕ 매물 올리기</summary>
      <form id="listingForm" class="stack">
        <div class="grid">
          <div><label for="address">주소</label><input id="address" maxlength="100" placeholder="예: 서울 관악구 ○○동 ○○빌라" required></div>
          <div><label for="room">호실</label><input id="room" maxlength="20" placeholder="예: 302호"></div>
          <div><label for="leaseType">구분</label>
            <select id="leaseType"><option>월세</option><option>전세</option></select></div>
          <div><label for="deposit">보증금 (원)</label><input id="deposit" type="number" min="0" value="0"></div>
          <div id="rentBox"><label for="rent">월세 (원)</label><input id="rent" type="number" min="0" value="0"></div>
          <div><label for="mgmt">관리비 (원)</label><input id="mgmt" type="number" min="0" value="0"></div>
          <div><label for="availableFrom">입주 가능일</label><input id="availableFrom" type="date"></div>
          <div><label for="contactPhone">문의 번호 (선택)</label><input id="contactPhone" type="tel" placeholder="비우면 번호 없이 공개"></div>
        </div>
        <div><label for="description">설명 (선택)</label><textarea id="description" maxlength="1000" placeholder="예: 남향, 풀옵션, 주차 1대"></textarea></div>
        <p class="small muted">공개 목록에는 위 내용만 나갑니다. 이름과 아이디는 나가지 않으며, 신청한 사람에게만 이름·번호가 보입니다.</p>
        <button class="btn primary" id="btnListing" type="submit">매물 공개</button>
      </form>
    </details>
  </section>

  <section class="card stack">
    <h2>내 정보</h2>
    <dl class="kv" id="profile"></dl>
    <details>
      <summary class="btn sm">🔑 비밀번호 변경</summary>
      <form id="pwForm" class="stack">
        <div><label for="current">현재 비밀번호</label><input id="current" type="password" autocomplete="current-password" required></div>
        <div><label for="newPw">새 비밀번호 (8자 이상)</label><input id="newPw" type="password" autocomplete="new-password" minlength="8" required></div>
        <button class="btn primary" id="btnPw" type="submit">변경</button>
        <p class="small muted">변경하면 다른 기기의 로그인은 끝납니다.</p>
      </form>
    </details>
  </section>
</main>
<script src="app.js"></script>
<script src="my.js"></script>
</body>
</html>
