<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Rent5 계약 신청</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
<main class="wrap narrow">
  <header class="top">
    <a class="brand" href="./">🏠 Rent5</a>
    <nav class="nav" id="nav"></nav>
  </header>
  <div id="alert"></div>

  <h1>계약 신청</h1>
  <section class="card stack" id="listingCard" hidden></section>
  <form class="card stack" id="applyForm" hidden>
    <div class="alert" id="callTip"></div>
    <div><label for="message">임대인에게 남길 말 (선택)</label>
      <textarea id="message" maxlength="300" placeholder="예: 직장인, 2년 거주 희망, 입주 가능일 협의 가능"></textarea></div>
    <button class="btn primary" id="btnApply" type="submit">계약 신청하기</button>
    <p class="small muted">신청하면 임대인이 이름과 휴대폰 번호를 볼 수 있습니다. 임대인이 조건을 제시하면 내용을 확인하고 서명하세요. 주민등록번호는 입력하지 않습니다.</p>
  </form>
  <p><a href="./">← 매물 목록</a></p>
</main>
<script src="app.js"></script>
<script src="apply.js"></script>
</body>
</html>
