<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data:; style-src 'self'; script-src 'self'">
  <title>Rent5 직거래 임대 — 중개사 없이 집주인과 직접 계약</title>
  <meta name="description" content="중개사 없이 임대인과 임차인이 직접 계약합니다. 매물을 찾고, 통화와 현장 확인 뒤, 예약하고 대화창에서 계약하세요.">
  <link rel="stylesheet" href="style.css">
</head>
<body>
<main class="wrap">
  <header class="top">
    <a class="brand" href="./">🏠 Rent5</a>
    <nav class="nav" id="nav"></nav>
  </header>
  <div id="alert"></div>

  <section class="hero">
    <h1>중개사 없이, 집주인과 직접 계약</h1>
    <p class="muted">[계약 신청]을 누르면 임대인에게 전화가 걸립니다. 현장에서 확인한 뒤 [예약]을 누르세요.</p>
    <ol class="steps-guide">
      <li>계약 신청 → 임대인과 통화</li>
      <li>현장 방문 · 매물 확인</li>
      <li>예약 (로그인) → 계약방</li>
      <li>서로 정보 확인 · 등기부 열람</li>
      <li>계약금(10%) 송금 → 종료</li>
    </ol>
  </section>

  <form class="row" id="searchForm" autocomplete="off">
    <input id="keyword" type="search" placeholder="주소로 찾기 (예: 시크로, 관악구)" aria-label="주소 검색">
    <select id="leaseType" aria-label="구분">
      <option value="">월세 · 전세</option>
      <option value="월세">월세</option>
      <option value="전세">전세</option>
    </select>
  </form>
  <p class="small muted" id="count" role="status"></p>

  <section class="grid cards" id="listings"><div class="card muted">불러오는 중...</div></section>
</main>
<script src="app.js"></script>
<script src="index.js"></script>
</body>
</html>
