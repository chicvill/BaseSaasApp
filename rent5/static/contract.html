<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data:; style-src 'self'; script-src 'self'">
  <title>Rent5 계약</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
<main class="wrap">
  <header class="top">
    <a class="brand" href="./">🏠 Rent5</a>
    <nav class="nav" id="nav"></nav>
  </header>
  <div id="alert"></div>

  <div class="row between">
    <h1 id="title">계약</h1>
    <span class="badge" id="roleBadge"></span>
  </div>
  <p class="muted" id="statusLine" role="status">불러오는 중...</p>
  <ol class="progress" id="progress"></ol>

  <div class="split" id="split" hidden>
    <section class="chatroom" id="chatroom" aria-label="계약방 대화">
      <div class="pane-head" id="chatHead"></div>
      <div class="chat-scroll" id="chatScroll">
        <div class="chat-log" id="chatLog" role="log" aria-live="polite"></div>
        <div class="stack inline-actions" id="actions"></div>
      </div>
      <form class="chat-form" id="chatForm">
        <input id="chatText" maxlength="500" autocomplete="off" placeholder="메시지를 입력하세요">
        <button class="btn primary" id="chatSend" type="submit">보내기</button>
      </form>
    </section>
  </div>
  <p><a href="my.html">← 내 화면</a></p>
</main>
<script src="app.js"></script>
<script src="contract.js"></script>
</body>
</html>
